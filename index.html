<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的闯关工作台</title>
<meta name="theme-color" content="#9c5b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F3EFE6;--paper:#F3EFE6;--card:#FFFFFF;--card2:#FAF7F0;
 --ink:#3A3D3A;--ink2:#5A5D5A;--muted:#8A8D88;
 --accent:#6E94A6;--accent-weak:#E3ECF0;--accent-ink:#3F6E80;
 --red:#C58A8A;--red2:#B03021;--purple:#9A8FB0;--warm:#B5651D;
 --line:#E2DDD2;--line-dash:#D8CFC4;--track:#EDE9E0;--ok:#3c6b4a;--bad:#b03021;
 --yellow:#F4ECD8;--pink:#F0E2DF;--green:#DCEBE0;--blue:#E2ECF2;--lilac:#ECE6F0;--orange:#F4E6D6;
 --radius:16px;--shadow:0 2px 10px rgba(60,50,40,.07);--card-opacity:100%
}
[data-theme="dark"]{
 --bg:#26282A;--paper:#26282A;--card:#323436;--card2:#2E3032;
 --ink:#E8E6E0;--ink2:#C7C9C5;--muted:#9A9C98;
 --accent:#8FB6C6;--accent-weak:#33424A;--accent-ink:#BFE0EC;
 --red:#C99A9A;--red2:#D98B8B;--purple:#A99FBE;--warm:#D6A86A;
 --line:#3A3D3A;--line-dash:#4A4D4A;--track:#2E3032;--ok:#8FC7A0;--bad:#E08A8A;
 --yellow:#3A3526;--pink:#3A2A2A;--green:#2A3A30;--blue:#26323A;--lilac:#332F3A;--orange:#3A3226;
 --shadow:0 2px 12px rgba(0,0,0,.35);--card-opacity:100%
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);
 font-family:"ZCOOL KuaiLe","楷体",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:16px;line-height:1.6}
.wrap{max-width:420px;margin:0 auto;padding:12px 12px 80px}
header{position:relative;text-align:center;margin-bottom:8px}
header h1{font-family:"Ma Shan Zheng","ZCOOL KuaiLe",cursive;font-size:24px;margin:2px 0;color:var(--accent)}
.tape{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);width:120px;height:20px;background:repeating-linear-gradient(45deg,#f4c7c3,#f4c7c3 8px,#f8d2a8 8px,#f8d2a8 16px);opacity:.85;border-radius:3px}
.date{display:inline-block;background:var(--yellow);padding:2px 12px;border-radius:18px;font-size:12px}
.banner{position:sticky;top:0;z-index:30;background:var(--card2);border:2px dashed var(--accent);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px;color:var(--accent-ink);box-shadow:var(--shadow)}
.app{display:flex;gap:10px;align-items:flex-start}
.app.nav-collapsed{gap:0}
.nav{width:132px;flex:0 0 auto;min-width:0;display:flex;flex-direction:column;gap:6px;transition:width .2s,opacity .2s}
.nav.collapsed{width:0;padding:0;border:none;overflow:hidden;opacity:0;flex-basis:0;gap:0}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;min-height:46px;border:2px dashed var(--line);border-radius:12px;background:var(--card);color:var(--ink2);font-family:inherit;font-size:14px;cursor:pointer;transition:.15s}
.nav button .ico{width:20px;height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.nav button .ico svg{width:20px;height:20px}
.nav button .lbl{flex:1;white-space:nowrap;overflow:hidden}
.nav button.active{background:var(--accent-weak);color:var(--accent-ink);border-color:var(--accent);border-left:3px solid var(--accent)}
.nav.collapsed button .lbl{display:none}
.nav button:hover{border-color:var(--accent)}
.main{flex:1;min-width:0}
.card{background:color-mix(in srgb,var(--card) var(--card-opacity),transparent);border:2px dashed var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
#bgLayer{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;transition:opacity .25s,filter .25s}
.card h2{font-family:"Ma Shan Zheng",cursive;font-size:20px;margin:0 0 8px;color:var(--accent)}
.card h3{font-size:16px;color:var(--ink2);margin:10px 0 4px}
.sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sub button{padding:5px 10px;border:2px dashed var(--line);border-radius:10px;background:#fffdfa;font-family:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
.sub button.active{background:var(--lilac);color:#5a3a6a;border-color:#c9a9d8}
/* status */
.hero{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.plant{width:96px;height:112px;flex:0 0 auto}
.lvbox{flex:1;min-width:180px}
.lv b{font-family:"Ma Shan Zheng",cursive;font-size:20px;color:var(--bad)}
.xpbar{height:14px;background:#f0e9dd;border-radius:9px;overflow:hidden;margin:4px 0}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#8fd0a0,#5fae74);transition:width .5s}
.xptxt{font-size:11px;color:var(--muted)}
/* quest */
.qtitle{font-weight:bold;color:var(--accent-ink)}
.reward{font-size:12px;color:var(--warm);background:var(--yellow);border-radius:8px;padding:5px 9px;margin:6px 0;transform:rotate(-.3deg)}
.ring{width:50px;height:50px;border-radius:50%;background:conic-gradient(#8fd0a0 calc(var(--p)*1%),#eee 0);display:flex;align-items:center;justify-content:center;font-size:11px;color:#5fae74;flex:0 0 auto}
.task{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dotted #ece3d6}
.cb{width:20px;height:20px;border:2px solid #c9bcae;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5fae74;background:#fff;flex:0 0 auto}
.task.done .cb{background:#cde8d2;border-color:#8fd0a0}
.task.done .txt{text-decoration:line-through;color:#aab}
.txt{flex:1}.xp{font-size:11px;color:var(--warm);background:var(--orange);border-radius:10px;padding:1px 7px;flex:0 0 auto}
.add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.add input,.add select{padding:6px 8px;border:2px dashed var(--line);border-radius:9px;font-family:inherit;font-size:12px;background:#fffdfa;flex:1;min-width:120px}
.btn{padding:9px 14px;min-height:44px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
.btn.sm{padding:5px 12px;font-size:13px;min-height:38px}.btn.alt{background:var(--accent-weak);color:var(--accent-ink)}.btn.green{background:#7fae8c}.btn.ghost{background:var(--card);color:var(--accent-ink);border:2px dashed var(--accent)}
/* stages */
.stagecur{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stagecur button{padding:4px 9px;border-radius:10px;border:2px solid var(--line);background:#fffdfa;font-family:inherit;font-size:12px;cursor:pointer}
.stagecur button.active{background:#cde8d2;border-color:#8fd0a0;color:var(--ok);font-weight:bold}
.remind{background:var(--blue);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.pit{background:#fde2c4;border-radius:10px;padding:8px 10px;font-size:12px;margin:6px 0;color:#9a5a1d}
.stampmini{display:inline-block;font-size:12px;background:#cde8d2;border-radius:10px;padding:2px 9px;color:var(--ok)}
/* tables */
.tbl{border-collapse:collapse;width:100%;font-size:12px;margin-top:4px}
.tbl th{background:#9aa0a6;color:#fff;padding:5px 6px;text-align:left;font-weight:normal}
.tbl td{border:1px solid #ece3d6;padding:5px 6px;vertical-align:top}
.tbl td[contenteditable]{background:#fffdfa;outline:none}
.tbl td[contenteditable]:focus{background:#fff7e8}
.x{cursor:pointer;color:var(--red);font-weight:bold;padding:0 4px}
.addrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.addrow input{flex:1;min-width:80px;padding:5px 7px;border:2px dashed var(--line);border-radius:8px;font-family:inherit;font-size:12px}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fffdfa;cursor:pointer;padding:4px;overflow:hidden;text-align:center}
.stamp .seal{font-size:clamp(12px,5vw,22px);filter:grayscale(1);opacity:.35;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.stamp.on{border-color:var(--red);background:#fff4f1}.stamp.on .seal{filter:none;opacity:1;animation:stampin .5s;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
@keyframes stampin{0%{transform:scale(2.4) rotate(-18deg);opacity:0}60%{transform:scale(.9) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg)}}
/* morning */
.morning{background:#fff7e8;border:2px dashed #e0b96a;border-radius:12px;padding:10px;font-size:13px;line-height:1.7;white-space:pre-wrap}
.morning .h{font-family:"Ma Shan Zheng",cursive;color:var(--warm);font-size:16px;margin-bottom:4px}
textarea.note{width:100%;min-height:50px;border:2px dashed var(--line);border-radius:9px;font-family:inherit;font-size:12px;padding:6px;background:#fffdfa}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.float{position:fixed;font-family:"Ma Shan Zheng",cursive;color:#5fae74;font-size:18px;pointer-events:none;animation:floatup 1s forwards;z-index:50}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
.confetti{position:fixed;top:-10px;width:8px;height:13px;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:rgba(60,40,40,.45);display:none;align-items:center;justify-content:center;z-index:80}
.modal.show{display:flex}
.box{background:var(--card);border:3px dashed var(--accent);border-radius:18px;padding:20px;max-width:300px;text-align:center;box-shadow:var(--shadow);animation:pop .4s}
.box.wide{max-width:440px;text-align:left;max-height:80vh;overflow:auto}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.box .big{font-size:42px}.box h3{font-family:"Ma Shan Zheng",cursive;color:var(--accent-ink);margin:6px 0}.box p{font-size:13px;color:var(--accent-ink)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:90}
.toast.show{opacity:1}
/* ---- 云同步 UI ---- */
.cloud-status{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--card);border:2px dashed var(--accent);color:var(--accent-ink);white-space:nowrap}
.cloud-status.off{background:#f3ede4;color:#a08a7e}
.cloud-status.ok{background:#eaf5ee;border-color:#7fae8c;color:#3f7a55}
.cloud-status.syncing{background:#fff7e6;border-color:#e0b15a;color:#a9772a}
.cloud-status.err{background:#fdecec;border-color:#d98b8b;color:#b14b4b}
.ck-lbl{display:block;font-size:12px;color:var(--accent-ink);margin:10px 0 4px;font-weight:bold}
.ck-inp{width:100%;box-sizing:border-box;padding:8px 10px;border:2px solid #e3d6c6;border-radius:10px;font-family:inherit;font-size:13px;color:#5a3b36;background:#fffdfa}
.ck-inp:focus{outline:none;border-color:var(--red)}
.ck-status{font-size:12px;margin:10px 0;min-height:16px;color:var(--accent-ink)}
.ck-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ck-btns .btn{flex:1 1 auto}
.ck-hint{font-size:11px;color:#b09a8e;line-height:1.5;margin-top:6px}
/* overview stat strip */
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:8px 0}
.stat{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:18px;color:var(--accent-ink);font-family:'Ma Shan Zheng',cursive}
.stat span{font-size:11px;color:var(--muted)}
/* quote / energy */
.quote{background:linear-gradient(135deg,#fff7e8,#fdeef3);border:2px dashed #e0b96a;border-radius:12px;padding:12px;font-size:14px;color:var(--accent-ink);line-height:1.7}
.quote .q{font-family:'Ma Shan Zheng',cursive;color:var(--warm);font-size:16px;margin-bottom:4px}
/* focus timer */
.focus{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;margin:10px 0}
.focus-circle{position:relative;width:140px;height:140px}
.focus-circle .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.focus-circle .t .tm{font-size:26px;font-weight:bold;color:var(--accent-ink);font-family:'Ma Shan Zheng',cursive}
.focus-btns{display:flex;gap:8px;flex-wrap:wrap}
/* heatmap (github style) */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding:4px 0}
.heat-cell{width:13px;height:13px;border-radius:3px;background:#f0e9dd}
.heat-cell.on{background:#8fd0a0}
.heat-cell.on2{background:#5fae74}
.heat-legend{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.heat-legend i{display:inline-block;width:11px;height:11px;border-radius:3px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kanban-col{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:80px}
.kanban-col h4{margin:0 0 6px;font-size:12px;color:var(--accent-ink);text-align:center}
.kanban-card{background:#fff; border:1px solid #ece3d6;border-radius:9px;padding:7px;margin-bottom:6px;font-size:12px;color:var(--accent-ink);cursor:pointer;box-shadow:1px 1px 0 rgba(0,0,0,.04)}
.kanban-card .w{height:6px;background:#f0e9dd;border-radius:4px;margin-top:5px;overflow:hidden}
.kanban-card .w i{display:block;height:100%;background:#8fd0a0}
/* social card */
.social-card{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;position:relative}
.social-card .pf{font-weight:bold;color:var(--accent-ink);font-size:15px}
.social-card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 0}
.tagchip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;background:#e3d4f0;color:#5a3a6a;cursor:pointer;margin:2px}
.tagchip.active{background:var(--accent);color:#fff}
.search{width:100%;padding:7px 9px;border:2px dashed var(--line);border-radius:9px;font-family:inherit;font-size:13px;background:#fffdfa;margin-bottom:8px}
/* renovation overall progress */
.overall{height:16px;background:#f0e9dd;border-radius:9px;overflow:hidden;margin:6px 0}
.overall i{display:block;height:100%;background:linear-gradient(90deg,#8fd0a0,#5fae74)}
/* renovation gantt */
.gantt{display:flex;height:34px;border-radius:8px;overflow:hidden;border:2px solid var(--line);margin-top:8px;position:relative}
.g-seg{display:flex;align-items:center;justify-content:center;font-size:12px;color:#5a3a2a;border-right:1px solid #fffdfa;min-width:0;overflow:hidden}
.g-now{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad)}
.g-now::after{content:"今";position:absolute;top:-15px;left:-7px;font-size:10px;color:var(--bad);font-weight:bold}
/* budget warning */
.warnbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:12px;font-size:13px;margin-bottom:10px}
.warnbar.over{background:#fceae8;border:2px solid #e7a59f}
.warnbar.ok{background:#eaf6ed;border:2px solid #a9d8b8}
.warnbar b{font-size:15px}
/* pie */
.pie-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pie-legend{flex:1;min-width:160px;font-size:12px}
.pie-legend div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted #ece3d6}
.pie-legend .hot{color:var(--bad);font-weight:bold}
@media(max-width:680px){.kanban{grid-template-columns:1fr}}
/* renovation acceptance */
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:4px;vertical-align:middle}
.badge-key{background:#f4c7c3;color:#8e2525}
.badge-imp{background:#fcebc2;color:#9a5a1d}
.badge-nor{background:#e9e9e9;color:#666}
.badge-type{background:#cfe3f2;color:#3a5a7a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:11px;padding:4px 9px;border-radius:10px;background:#fff7e8;border:2px dashed #e0b96a;color:var(--accent-ink)}
.guide summary{cursor:pointer;color:var(--accent-ink);font-size:13px;font-weight:bold}
.guide ul{margin:6px 0;padding-left:18px;font-size:12px;color:var(--accent-ink);line-height:1.6}
.guide .defect-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.guide .defect-item{background:#fffdfa;border:2px dashed var(--line);border-radius:10px;padding:6px 9px;font-size:12px;flex:1;min-width:120px}
.metrics{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.metric{display:flex;gap:8px;background:#fffdfa;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.metric b{color:var(--accent-ink);flex:0 0 88px}
.metric span{color:var(--accent-ink)}
.defect{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:8px;border-left:5px solid #f4c7c3;position:relative}
.defect-status-0{border-left-color:#f4c7c3}
.defect-status-1{border-left-color:#fcebc2}
.defect-status-2{border-left-color:#cde8d2}
.mini-photo{width:44px;height:44px;object-fit:cover;border-radius:6px;border:2px dashed var(--line);cursor:pointer;margin:2px}
.row-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:6px}
.row-actions button{font-size:11px;padding:2px 7px;border-radius:8px;border:2px dashed #c9bcae;background:#fffdfa;color:var(--accent-ink);cursor:pointer;font-family:inherit}
.note-inline{width:100%;min-height:46px;border:2px dashed var(--line);border-radius:9px;font-family:inherit;font-size:12px;padding:6px;background:#fffdfa;margin-top:6px}
.shot-list{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.shot-tag{font-size:11px;padding:3px 8px;border-radius:10px;background:#e3d4f0;color:#5a3a6a}
@media(max-width:680px){.stamps{grid-template-columns:repeat(3,1fr)}.nav{width:118px}}
/* fitness redesign */
.fit-block{margin:8px 0;padding:8px 10px;background:#fffdfa;border:2px dashed var(--line);border-radius:10px}
.fit-h{font-size:12px;font-weight:bold;color:var(--accent-ink);margin-bottom:4px}
.fit-steps{margin:0;padding-left:18px;font-size:12px;color:#5a4a44;line-height:1.7}
.fit-caut{margin:0;padding-left:18px;font-size:12px;color:var(--red2);line-height:1.7}
.fit-timer{display:flex;flex-direction:column;align-items:center;gap:6px;background:#f0e9dd;border-radius:12px;padding:14px;margin:8px 0}
.fit-phase{padding:4px 14px;border-radius:20px;background:#fffdfa;font-size:13px;color:var(--accent-ink);font-weight:bold}
.fit-big{font-size:30px;font-weight:bold;font-family:'Ma Shan Zheng',cursive;color:var(--accent-ink)}
.fit-sub{font-size:12px;color:var(--muted)}
.vid{margin-top:8px}
.vidframe{width:100%;aspect-ratio:16/9;border:2px dashed var(--line);border-radius:10px;background:#000;margin-top:6px}
/* reading / film / knowledge / stamps redesign */
.goalbar{height:10px;background:#f0e9dd;border-radius:6px;overflow:hidden;margin-top:4px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd0a0,#5fae74)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tab{display:inline-block;font-size:12px;padding:3px 12px;border-radius:12px;background:#fffdfa;border:2px dashed var(--line);color:var(--muted);cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bk-card{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative}
.bk-card:hover{border-color:var(--red)}
.film-card{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative}
.film-card:hover{border-color:var(--red)}
.platbar{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px}
.platbar .track{flex:1;height:12px;background:#f0e9dd;border-radius:7px;overflow:hidden}
.platbar .track i{display:block;height:100%;background:var(--accent)}
.platbar .n{color:var(--muted);min-width:54px;text-align:right}
.kcard{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative}
.kcard:hover{border-color:var(--red)}
.review-q{background:#fff7e8;border:2px dashed #e0b96a;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--accent-ink);margin:6px 0}
.badge-detail{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;margin:6px 0}
.badge-detail .ok{color:var(--ok);font-weight:bold}
/* theme toggle + nav toggle */
.theme-btn{width:40px;height:40px;border-radius:11px;border:2px dashed var(--accent);background:var(--card);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.theme-btn svg{width:20px;height:20px}
.nav-toggle{width:40px;height:40px;border-radius:11px;border:2px dashed var(--line);background:var(--card);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.nav-toggle svg{width:20px;height:20px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.hdr-top h1{margin:0;text-align:left}
.hdr-actions{display:flex;gap:6px;flex:0 0 auto}
.search-bar{display:none;padding:8px 0}
.search-bar.show{display:block}
.search-bar input{width:100%;padding:8px 12px;border:2px dashed var(--accent);border-radius:12px;font-family:inherit;font-size:14px;background:var(--card);color:var(--ink)}
.search-dropdown{position:fixed;left:12px;right:12px;max-width:396px;margin:0 auto;z-index:90;background:var(--card);border:2px dashed var(--accent);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none}
.search-dropdown.show{display:block}
.search-group{padding:8px 10px;border-bottom:1px dashed var(--line)}
.search-group:last-child{border-bottom:none}
.search-group h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:normal}
.search-result{padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.search-result:hover{background:var(--accent-weak)}
.search-result b{color:var(--accent-ink)}
.search-result small{display:block;font-size:11px;color:var(--muted)}
.search-btn{width:40px;height:40px;border-radius:11px;border:2px dashed var(--line);background:var(--card);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.search-btn svg{width:20px;height:20px}
/* splash */
.splash{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}
.splash-flower{width:170px;height:170px;color:var(--accent);filter:drop-shadow(0 4px 8px rgba(0,0,0,.08))}
.splash-date{font-size:14px;color:var(--muted);letter-spacing:.5px}
.splash-hi{font-size:28px;color:var(--ink);font-family:'Ma Shan Zheng',cursive}
.splash-hi small{display:block;font-size:14px;color:var(--muted);font-family:inherit;margin-top:4px}
.splash-quote{font-size:18px;color:var(--accent-ink);max-width:300px;line-height:1.6;padding:0 12px}
.splash-btn{min-width:200px;padding:13px 26px;font-size:16px;border-radius:30px}
/* focus fullscreen overlay (iOS-safe fixed layer) */
.focus-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.focus-overlay.show{display:flex}
.focus-overlay .big-ring{position:relative;width:240px;height:240px}
.focus-overlay .big-ring svg{width:240px;height:240px}
.focus-overlay .big-ring .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.focus-overlay .big-ring .tt .tm{font-size:52px;font-weight:bold;color:var(--ink);font-family:'Ma Shan Zheng',cursive}
.focus-overlay .big-ring .tt .sub{font-size:15px;color:var(--muted)}
.focus-overlay .fbtns{display:flex;gap:12px}
.focus-overlay .fbtns .btn{min-width:120px}
/* settings module */
.set-sec{font-size:13px;color:var(--muted);margin:4px 2px 6px}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.set-row .k{font-size:14px;color:var(--ink2);min-width:80px}
.set-seg{display:flex;gap:6px;flex-wrap:wrap}
.set-seg button{padding:8px 14px;border-radius:10px;border:2px dashed var(--line);background:var(--card);font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink2);min-height:40px}
.set-seg button.on{background:var(--accent-weak);color:var(--accent-ink);border-color:var(--accent)}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:inline-block;vertical-align:middle}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.avatar-box{width:54px;height:54px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;flex:0 0 auto}
.navorder{background:var(--card2);border:2px dashed var(--line);border-radius:12px;padding:8px}
.navorder .item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-size:14px;color:var(--ink);background:var(--card);margin-bottom:6px;border:1px solid var(--line)}
.navorder .item .ico{width:18px;height:18px;color:var(--accent);flex:0 0 auto}
.navorder .item .mv{margin-left:auto;display:flex;gap:4px}
.navorder .item .mv button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);cursor:pointer;font-size:14px}
.ai-card{background:var(--card2);border:2px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.ai-card label{display:block;font-size:13px;color:var(--ink2);margin:8px 0 4px}
.ai-card input{width:100%;box-sizing:border-box;padding:9px 11px;border:2px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:var(--card);color:var(--ink)}
.set-row input,.set-row textarea,.note-inline{width:100%;min-width:0;box-sizing:border-box}
.ai-note{font-size:11px;color:var(--muted);margin-top:6px}
.weekend-card{background:var(--card2);border:2px dashed var(--accent);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.weekend-card .day{font-size:20px;font-weight:bold;color:var(--accent-ink)}
.linkbtn{display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-size:13px;text-decoration:none;border:2px dashed var(--accent);border-radius:10px;padding:7px 12px;background:var(--accent-weak);cursor:pointer;min-height:38px}
/* dark mode cascade: re-skin remaining pastel containers + brown text */
[data-theme="dark"] .social-card,[data-theme="dark"] .bk-card,[data-theme="dark"] .film-card,[data-theme="dark"] .kcard,[data-theme="dark"] .kanban-col,[data-theme="dark"] .kanban-card,[data-theme="dark"] .defect,[data-theme="dark"] .metric,[data-theme="dark"] .fit-block,[data-theme="dark"] .badge-detail,[data-theme="dark"] .add input,[data-theme="dark"] .add select,[data-theme="dark"] .addrow input,[data-theme="dark"] .search,[data-theme="dark"] .note-inline,[data-theme="dark"] .mini-photo,[data-theme="dark"] .tbl td,[data-theme="dark"] .row-actions button,[data-theme="dark"] .defect-item,[data-theme="dark"] .fit-phase,[data-theme="dark"] .stamp,[data-theme="dark"] .stat,[data-theme="dark"] .sub button,[data-theme="dark"] .guide .defect-item,[data-theme="dark"] .quote,[data-theme="dark"] .morning,[data-theme="dark"] .pit,[data-theme="dark"] .remind,[data-theme="dark"] .reward,[data-theme="dark"] .chip,[data-theme="dark"] .box{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
[data-theme="dark"] .card h3,[data-theme="dark"] .social-card .pf,[data-theme="dark"] .qtitle,[data-theme="dark"] .fit-h,[data-theme="dark"] .focus-circle .t .tm,[data-theme="dark"] .stat span,[data-theme="dark"] .heat-legend,[data-theme="dark"] .xptxt,[data-theme="dark"] .fit-sub,[data-theme="dark"] .social-card .row,[data-theme="dark"] .txt,[data-theme="dark"] .morning .h,[data-theme="dark"] .x,[data-theme="dark"] .kanban-col h4,[data-theme="dark"] .tbl th{color:var(--muted)!important}
/* ---- 开屏页 ---- */
.splash{max-width:340px;margin:14px auto 0;text-align:center;padding:18px 10px;animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.splash-flower{width:148px;height:148px;color:var(--accent);margin:0 auto 4px;animation:bloom 1.3s ease-out}
@keyframes bloom{0%{transform:scale(.3) rotate(-30deg);opacity:0}60%{transform:scale(1.06) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.splash-date{font-size:14px;color:var(--muted);letter-spacing:1px}
.splash-hi{font-family:'Ma Shan Zheng',cursive;font-size:26px;color:var(--accent-ink);margin:8px 0 2px}
.splash-hi small{display:block;font-family:inherit;font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:0}
.splash-quote{font-size:15px;color:var(--warm);background:var(--yellow);border-radius:12px;padding:10px 14px;margin:12px auto;max-width:300px;line-height:1.6}
.splash-btn{margin-top:14px;font-size:16px;padding:12px 22px}
/* ---- 体态课程路线 ---- */
.pos-road{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pos-step{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px dashed var(--line);border-radius:12px;background:#fffdfa;cursor:pointer;transition:.15s}
.pos-step.active{border-color:var(--accent);background:var(--accent-weak)}
.pos-step.done{opacity:.72}
.pos-no{width:26px;height:26px;border-radius:50%;background:var(--track);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
.pos-step.done .pos-no{background:#cde8d2;color:var(--ok)}
.pos-name{font-weight:bold;color:var(--accent-ink);font-size:15px}
.pos-sub{font-size:11px;color:var(--muted)}
/* ---- 魔法图书馆 ---- */
.room-head{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.lib{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.room{width:calc(33.333% - 7px);min-width:96px;background:var(--card2);border:2px dashed var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;position:relative;transition:.2s;overflow:hidden}
.room:hover{border-color:var(--accent)}
.room-win{width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0 30%,#e9e2d4 31% 100%);box-shadow:inset 0 0 0 4px #efe7d8;transition:.3s}
.film-room .room-win{position:relative;background:radial-gradient(circle at 50% 38%,#5b6b7a 0 32%,#2f3a47 33% 100%);box-shadow:inset 0 0 0 4px #1f2730,0 2px 6px rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.2)}
.film-room .room-win::after{content:"🎬";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;line-height:1}
.room.lit{background:linear-gradient(160deg,#fff6e2,#fdeccf);border-color:var(--warm)}
.room.lit .room-win{background:radial-gradient(circle at 50% 40%,#fff6c8 0 30%,#ffd66b 31% 100%);box-shadow:0 0 16px 4px rgba(255,200,90,.7),inset 0 0 0 4px #ffe39a;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 14px 3px rgba(255,200,90,.55),inset 0 0 0 4px #ffe39a}50%{box-shadow:0 0 22px 6px rgba(255,200,90,.85),inset 0 0 0 4px #ffe7a8}}
.room-name{font-weight:bold;color:var(--accent-ink);font-size:14px}
.room-meta{font-size:11px;color:var(--muted);margin-top:2px}
.room:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.12);border-color:var(--accent)}
.room-enter{display:inline-block;margin-top:5px;color:var(--accent);font-weight:bold;font-size:11px}
[data-theme="dark"] .room:hover{border-color:var(--accent);box-shadow:0 6px 14px rgba(0,0,0,.4)}
[data-theme="dark"] .room.lit{background:linear-gradient(160deg,#3a3326,#332c1f)}
[data-theme="dark"] .room-win{background:radial-gradient(circle at 50% 40%,#444 0 30%,#2a2a2a 31% 100%);box-shadow:inset 0 0 0 4px #333}
[data-theme="dark"] .room.lit .room-win{background:radial-gradient(circle at 50% 40%,#ffe9a8 0 30%,#e0a93b 31% 100%)}
/* ---- 首页仪表盘 ---- */
.home-hero{background:linear-gradient(160deg,var(--card),var(--card2));border:2px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.home-statusbar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.home-datecard{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hdc-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
.hdc-main{flex:1;min-width:0}
.hdc-name{font-weight:bold;font-size:17px;color:var(--ink)}
.hdc-date{font-size:13px;color:var(--muted);margin-top:2px}
.hdc-lv{background:var(--accent);color:#fff;font-size:13px;padding:4px 10px;border-radius:20px;font-weight:bold;flex:0 0 auto}
.home-statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.home-stat{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.home-stat b{display:block;font-size:20px;color:var(--accent-ink);font-weight:bold}
.home-stat span{font-size:11px;color:var(--muted)}
.home-activity{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.act-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;background:var(--card2);border-radius:10px}
.act-ico{font-size:15px;flex:0 0 auto}
.act-txt{flex:1;min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-date{font-size:11px;color:var(--muted);flex:0 0 auto}
.act-empty{font-size:13px;color:var(--muted);padding:8px;text-align:center}
/* ---- 图书馆书架 ---- */
.lib-hall{background:linear-gradient(160deg,#f6efe2,#efe6d4);border:2px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.lib-hall h3{font-family:'Ma Shan Zheng',cursive;color:var(--accent-ink)}
.shelf{display:flex;align-items:flex-end;gap:4px;background:linear-gradient(#caa978,#b8975f);padding:10px 8px 6px;border-radius:8px;margin:8px 0 4px;min-height:96px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.spine{flex:0 0 auto;width:20px;border-radius:3px 3px 0 0;cursor:pointer;transition:.15s;position:relative;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:upright;font-size:10px;color:#fff;padding:3px 0;overflow:hidden;box-shadow:1px 0 0 rgba(0,0,0,.08)}
.spine:hover{transform:translateY(-5px);filter:brightness(1.07)}
.spine small{line-height:1.05;max-height:82%;overflow:hidden;white-space:nowrap}
[data-theme="dark"] .lib-hall{background:linear-gradient(160deg,#2e2a24,#322c22)}
[data-theme="dark"] .shelf{background:linear-gradient(#5a4d3a,#4a3f2f)}
.film-win-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-top:8px}
.film-window{position:relative;min-height:122px;background:linear-gradient(160deg,#3a4250,#262c36);border-radius:16px;padding:14px;color:#fff;cursor:pointer;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.22);display:flex;flex-direction:column;justify-content:space-between;transition:transform .22s ease,box-shadow .22s ease;transform:translateX(0)}
.film-window::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,255,255,.16);background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.16),transparent 62%);pointer-events:none}
.film-window::after{content:"";position:absolute;inset:14px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.06) 0deg 8deg,transparent 8deg 16deg);pointer-events:none;opacity:.6}
.film-window:hover{transform:translateX(-9px) rotate(-1.2deg);box-shadow:12px 12px 24px rgba(0,0,0,.4)}
.film-window.lit{box-shadow:0 0 0 2px var(--ok),0 6px 16px rgba(120,200,140,.5);background:linear-gradient(160deg,#3f5a45,#27382f)}
.film-window .fw-title{position:relative;z-index:1;font-weight:bold;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.film-window .fw-sub{position:relative;z-index:1;font-size:11px;opacity:.85;margin-top:6px}
.film-window .fw-status{position:relative;z-index:1;align-self:flex-start;font-size:11px;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,.22);margin-top:8px}
[data-theme="dark"] .film-window{background:linear-gradient(160deg,#39414f,#222831);border-color:rgba(255,255,255,.1)}
[data-theme="dark"] .film-window.lit{background:linear-gradient(160deg,#36513c,#243a30)}
/* ---- 头像 emoji 画廊 ---- */
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;max-height:148px;overflow:auto;padding:6px;background:var(--card2);border:2px dashed var(--line);border-radius:10px}
.emoji-opt{font-size:20px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;line-height:1;transition:.12s}
.emoji-opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);background:var(--accent-weak)}
.emoji-opt:hover{transform:translateY(-2px)}
</style>
</head>

const KEY="workbench_save_v1";

const CLOUD_BIN="wb_cloud_bin";   // JSONBin Bin ID（仅存本机）
const API_ROOT="https://api.jsonbin.io/v3/b";
let S=load();let view="splash",sub="today";

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return seed();}
function save(){S.__updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));cloudSave();}

// ---------- 云端同步（JSONBin.io v3，跨设备同一份数据） ----------
function cloudCfg(){const k=localStorage.getItem(CLOUD_KEY)||"";const b=localStorage.getItem(CLOUD_BIN)||"";return{k:k,b:b,on:(k&&b)};}
function setCloudStatus(txt,cls){const el=document.getElementById("cloudStatus");if(el){el.textContent=txt;el.className="cloud-status "+(cls||"");}}
async function cloudLoad(){
 const c=cloudCfg();if(!c.on)throw new Error("未配置云端");
 const r=await fetch(API_ROOT+"/"+c.b+"/latest",{headers:{"X-Master-Key":c.k}});
 if(!r.ok)throw new Error("拉取失败 "+r.status);
 const j=await r.json();return j.record;           // 实际数据嵌套在 record 下
}
let _cloudBusy=false,_cloudPending=false;
async function cloudSave(){
 const c=cloudCfg();if(!c.on)return;                // 未配置则不联网
 if(_cloudBusy){_cloudPending=true;return;}         // 合并并发上传
 _cloudBusy=true;
 try{
  setCloudStatus("同步中…","syncing");
  const r=await fetch(API_ROOT+"/"+c.b,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":c.k},body:JSON.stringify(S)});
  if(!r.ok)throw new Error("上传失败 "+r.status);
  setCloudStatus("已同步 ☁","ok");
 }catch(e){setCloudStatus("同步失败 · 已本地保存","err");}
 _cloudBusy=false;
 if(_cloudPending){_cloudPending=false;cloudSave();}
}
async function cloudPull(silent){
 try{
  setCloudStatus("拉取云端…","syncing");
  const remote=await cloudLoad();
  const local=S.__updatedAt||0, remoteT=remote&&remote.__updatedAt||0;
  if(remote && remoteT>local){S=remote;localStorage.setItem(KEY,JSON.stringify(S));render();setCloudStatus("已从云端更新 ☁","ok");if(!silent)toast("已从云端更新");}
  else{setCloudStatus("本地即最新 ☁","ok");if(!silent)toast("本地已是最新");}
 }catch(e){setCloudStatus("云端不可用 · 本地模式","err");if(!silent)toast("拉取失败："+e.message);}
}
async function initCloudSync(){
 const c=cloudCfg();
 if(!c.on){setCloudStatus("云端未配置","off");return;}
 await cloudPull(true);
}

function applyBg(){const body=document.body;if(!body)return;
 const layer=document.getElementById("bgLayer");
 const cardOp=(S.settings&&S.settings.cardOpacity)!=null?S.settings.cardOpacity:1;
 document.documentElement.style.setProperty("--card-opacity",Math.round(cardOp*100)+"%");
 const presets={paper:"none",mist:"linear-gradient(160deg,#E8EFF2,#DCE7EC)",dawn:"linear-gradient(160deg,#FBF1E6,#F6E7D8)",sakura:"linear-gradient(160deg,#FCEFF3,#F3D9E0)",mint:"linear-gradient(160deg,#E8F5E9,#D0E8D4)",dusk:"linear-gradient(160deg,#E6E4F3,#D9D5EC)",graphite:"linear-gradient(160deg,#E8E8E8,#D4D4D4)"};
 if(isDarkTheme()){body.style.background="";if(layer){layer.style.backgroundImage="none";layer.style.opacity="";layer.style.filter="";}return;}
 body.style.background="";
 if(layer){
  const img=(S.settings&&S.settings.bgImage)||"";
  const blur=(S.settings&&S.settings.bgBlur)||0;
  const opacity=(S.settings&&S.settings.bgOpacity)!=null?S.settings.bgOpacity:1;
  if(img){layer.style.backgroundImage='url('+img+')';layer.style.backgroundColor="transparent";}
  else{const p=presets[(S.settings&&S.settings.bg)||"paper"]||"none";layer.style.backgroundImage=(p==="none"?"none":p);layer.style.backgroundColor="transparent";}
  layer.style.filter='blur('+blur+'px)';
  layer.style.opacity=opacity;
 }}

function handleBgUpload(file){
 if(!file)return;
 if(file.size>5*1024*1024){toast("图片太大，请选 5MB 以下");return;}
 const reader=new FileReader();
 reader.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const canvas=document.createElement("canvas");
   const maxW=1200;const w=img.width,h=img.height;
   const scale=Math.min(1,maxW/w);
   canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
   const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL("image/jpeg",0.7);
   if(!S.settings)S.settings={};S.settings.bgImage=data;
   const fn=document.getElementById("bgFileName");if(fn)fn.textContent="已上传自定义照片";
   save();applyBg();toast("背景图片已上传");
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}

let SEARCH_RESULTS=[];
function buildSearchIndex(){
 const idx=[];
 for(const mo in S.months){(S.months[mo].tasks||[]).forEach(t=>{if(t.text)idx.push({type:"任务",title:t.text,subtitle:mo,view:"home"});});}

 (r.materials||[]).forEach(m=>{if(m.name)idx.push({type:"主材",title:m.name,subtitle:m.brand||"",view:"reno",sub:"materials"});});
 (r.appliances||[]).forEach(a=>{if(a.name)idx.push({type:"家电",title:a.name,subtitle:a.brand||"",view:"reno",sub:"appliances"});});
 (r.smart||[]).forEach(s=>{if(s.device)idx.push({type:"智能设备",title:s.device,subtitle:s.room||"",view:"reno",sub:"smart"});});
 (S.reading||[]).forEach((b,i)=>{if(b.title)idx.push({type:"阅读",title:b.title,subtitle:b.author||"",view:"reading",idx:i});});
 (S.film||[]).forEach((f,i)=>{if(f.title)idx.push({type:"影视",title:f.title,subtitle:f.type||"",view:"film",idx:i});});
 (S.social||[]).forEach((s,i)=>{if(s.name||s.platform)idx.push({type:"自媒体",title:s.name||s.platform,subtitle:s.platform||"",view:"social",idx:i});});
 (S.writing||[]).forEach((w,i)=>{if(w.title)idx.push({type:"写作",title:w.title,subtitle:w.type||"",view:"writing",idx:i});});
 (S.knowledge||[]).forEach((k,i)=>{if(k.topic)idx.push({type:"知识",title:k.topic,subtitle:k.cat||"",view:"knowledge",idx:i});});
 (S.account&&S.account.records||[]).forEach((x,i)=>{if(x.note||x.cat)idx.push({type:"记账",title:(x.type==="in"?"收入":"支出")+" ¥"+x.amount+" · "+(x.cat||"其他"),subtitle:x.note||"",view:"money"});});
 const st=S.stocks||{};
 (st.holdings||[]).forEach(h=>{if(h.name||h.code)idx.push({type:"持仓",title:h.name||h.code,subtitle:h.code||"",view:"stocks"});});
 (st.watchlist||[]).forEach(w=>{if(w.name||w.code)idx.push({type:"自选",title:w.name||w.code,subtitle:w.code||"",view:"stocks"});});
 return idx;
}
function renderSearchResults(q){
 const dd=document.getElementById("searchDropdown");if(!dd)return;
 const term=(q||"").trim().toLowerCase();if(!term){dd.classList.remove("show");dd.innerHTML="";return;}
 SEARCH_RESULTS=buildSearchIndex().filter(x=>((x.title||"").toLowerCase().includes(term)||(x.subtitle||"").toLowerCase().includes(term)));
 if(!SEARCH_RESULTS.length){dd.innerHTML='<div class="search-group"><div class="search-result">无结果</div></div>';dd.classList.add("show");return;}
 const groups={};SEARCH_RESULTS.forEach(x=>{groups[x.type]=groups[x.type]||[];groups[x.type].push(x);});
 let html="";for(const type in groups){html+=`<div class="search-group"><h4>${esc(type)}</h4>`+groups[type].slice(0,3).map((x,i)=>`<div class="search-result" onclick="openSearchResult(${SEARCH_RESULTS.indexOf(x)})"><b>${esc(x.title)}</b><small>${esc(x.subtitle||"")}</small></div>`).join("")+`</div>`;}
 dd.innerHTML=html;dd.classList.add("show");
}
function openSearchResult(i){

}
function toggleSearchBar(){

 bar.classList.toggle("show");

 if(bar.classList.contains("show")){if(inp){inp.focus();renderSearchResults(inp.value);}}else{const dd=document.getElementById("searchDropdown");if(dd){dd.classList.remove("show");dd.innerHTML="";}if(inp)inp.value="";}
}
function initSearch(){
 const inp=document.getElementById("globalSearch");if(!inp)return;
 inp.oninput=e=>renderSearchResults(e.target.value);
 inp.onkeydown=e=>{if(e.key==="Escape"){e.target.value="";renderSearchResults("");toggleSearchBar();}};

}

function handleStagePhoto(e,stage){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{const id=Date.now()+Math.random();R().photos.push({id,stage,date:todayStr(),src:r.result,note:"",aiCheck:null});save();render();toast("照片已保存");};
 r.readAsDataURL(f);
}
function handleCheckPhoto(e,stage,idx){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const id=Date.now()+Math.random();
  const st=R().stages.find(s=>s.name===stage);
  if(!st.checks[idx].photos) st.checks[idx].photos=[];
  st.checks[idx].photos.push(id);
  R().photos.push({id,stage,date:todayStr(),src:r.result,note:"",aiCheck:null,checkIdx:idx});
  save();render();toast("照片已挂接到清单项");
 };
 r.readAsDataURL(f);
}
function handleDefectPhoto(e,defectId){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const id=Date.now()+Math.random();
  const d=R().defectLog.find(x=>x.id===defectId);
  if(d){if(!d.photos) d.photos=[];d.photos.push(id);}
  const st=R().currentStage;
  R().photos.push({id,stage:st,date:todayStr(),src:r.result,note:"",aiCheck:null,defectId});
  save();render();toast("照片已挂接到缺陷");
 };
 r.readAsDataURL(f);
}
function deleteStagePhoto(idx,stage){
 const arr=R().photos.filter(p=>p.stage===stage);const target=arr[idx];
 const i=R().photos.indexOf(target);
 if(i>=0){
  const pid=R().photos[i].id;
  // 同步清理 checklist / defect 中的引用
  R().stages.forEach(s=>{if(s.name===stage){s.checks.forEach(c=>{if(c.photos)c.photos=c.photos.filter(p=>p!==pid);});}});
  R().defectLog.filter(d=>d.stage===stage).forEach(d=>{if(d.photos)d.photos=d.photos.filter(p=>p!==pid);});
  R().photos.splice(i,1);save();render();
 }
}
function toggleCheck(stageName,i,e){
 const st=R().stages.find(s=>s.name===stageName);const c=st.checks[i];const was=c.d;
 c.d=!c.d;
 if(!was){S.checkinXp+=5;confetti();floatXp("+5 XP",e);}
 else{S.checkinXp=Math.max(0,S.checkinXp-5);}
 st.done=st.checks.every(x=>x.d);
 save();render();
 if(!was && st.done){setTimeout(()=>openStage(st.name),300);}
}
function saveNote(stage,idx,val){

function listSection(arr,fields){

 arr.forEach((it,idx)=>{h+='<tr>'+fields.map(f=>`<td contenteditable="true" data-i="${idx}" data-k="${f.k}">${esc(it[f.k]||'')}</td>`).join('')+`<td><span class="x" data-i="${idx}">✕</span></td></tr>`;});

 wrap.querySelectorAll('.x').forEach(x=>x.onclick=()=>{arr.splice(+x.dataset.i,1);save();render();});
 wrap.querySelector('.addrow .btn').onclick=()=>{const o={};fields.forEach(f=>{const i=wrap.querySelector('.addrow input[data-k="'+f.k+'"]');o[f.k]=i.value;i.value='';});arr.push(o);save();render();};

function addHolding(){const code=document.getElementById("shCode").value.trim();const name=document.getElementById("shName").value.trim();const shares=parseFloat(document.getElementById("shShares").value)||0;const cost=parseFloat(document.getElementById("shCost").value)||0;const price=parseFloat(document.getElementById("shPrice").value)||0;if(!code||!shares)return;const sector=document.getElementById("shSector").value.trim();const stop=parseFloat(document.getElementById("shStop").value)||null;const target=parseFloat(document.getElementById("shTarget").value)||null;const idx=S.stocks.holdings.findIndex(h=>h.code===code);if(idx>=0){const o=S.stocks.holdings[idx];S.stocks.holdings[idx]={code,name:name||o.name,shares,cost,price:price||cost,group:"A股",sector:sector||o.sector,stop:stop||null,target:target||null};}else{S.stocks.holdings.push({code,name:name||code,shares,cost,price:price||cost,group:"A股",sector,stop,target});}save();render();toast("持仓已更新");}
function addWatch(){const code=document.getElementById("shwCode").value.trim();const name=document.getElementById("shwName").value.trim();if(!code)return;const buyBelow=parseFloat(document.getElementById("shwBuyBelow").value)||null;const sellAbove=parseFloat(document.getElementById("shwSellAbove").value)||null;const note=document.getElementById("shwNote").value.trim();const wl=S.stocks.watchlist||(S.stocks.watchlist=[]);const idx=wl.findIndex(w=>w.code===code);if(idx>=0){const o=wl[idx];wl[idx]={code,name:name||o.name,buyBelow:buyBelow||null,sellAbove:sellAbove||null,note:note||o.note};}else{wl.push({code,name:name||code,buyBelow,sellAbove,note});}save();render();toast("自选已更新");}
function delWatch(code){S.stocks.watchlist=(S.stocks.watchlist||[]).filter(w=>w.code!==code);save();render();toast("已删除自选");}
function addTrade(){const g=id=>document.getElementById(id);const ticker=g("trTicker").value.trim();if(!ticker)return;const dir=g("trDir").value==="空"?-1:1;const entry=parseFloat(g("trEntry").value)||0;const exit=parseFloat(g("trExit").value)||0;const shares=parseFloat(g("trShares").value)||0;const pl=(exit-entry)*shares*dir;const t={id:Date.now(),date:g("trDate").value||todayStr(),ticker,dir,entry,exit,shares,stop:parseFloat(g("trStop").value)||null,pl,disc:g("trDisc").checked,habit:g("trHabit").value,mood:g("trMood").value,score:parseFloat(g("trScore").value)||0,lesson:g("trLesson").value.trim()};S.stocks.trades.push(t);save();render();toast("复盘已记录");}

let fitTimer={sets:0,setIdx:0,phase:"work",remaining:0,running:false,iv:null,work:0,rest:0};
function fitStart(){const ex=FITNESS_PLAN[new Date().getDay()];if(!ex)return;fitTimer.work=ex.work||30;fitTimer.rest=ex.rest||15;fitTimer.sets=ex.setsCount||1;fitTimer.setIdx=0;fitTimer.phase="work";fitTimer.remaining=fitTimer.work;fitTimer.running=true;beep(880);
 if(fitTimer.iv)clearInterval(fitTimer.iv);fitTimer.iv=setInterval(fitTick,1000);paintFit();}
function fitPause(){if(!fitTimer.sets){const ex=FITNESS_PLAN[new Date().getDay()];if(ex){fitTimer.work=ex.work||30;fitTimer.rest=ex.rest||15;fitTimer.sets=ex.setsCount||1;}}if(fitTimer.running){fitTimer.running=false;if(fitTimer.iv){clearInterval(fitTimer.iv);fitTimer.iv=null;}}else{fitTimer.running=true;if(!fitTimer.iv)fitTimer.iv=setInterval(fitTick,1000);}paintFit();}
function fitReset(){if(fitTimer.iv)clearInterval(fitTimer.iv);fitTimer={sets:0,setIdx:0,phase:"work",remaining:0,running:false,iv:null,work:0,rest:0};paintFit();}
function fitTick(){if(!fitTimer.running)return;fitTimer.remaining--;if(fitTimer.remaining<=0){
  if(fitTimer.phase==="work"){fitTimer.setIdx++;if(fitTimer.setIdx>=fitTimer.sets){if(fitTimer.iv)clearInterval(fitTimer.iv);fitTimer.iv=null;fitTimer.running=false;fitTimer.phase="done";beep(1320);paintFit();toast("🎉 今日动作完成！点‘完成今日动作’打卡 +10XP");return;}fitTimer.phase="rest";fitTimer.remaining=fitTimer.rest;beep(660);}
  else{fitTimer.phase="work";fitTimer.remaining=fitTimer.work;beep(880);}
 }paintFit();}
function paintFit(){const ph=document.getElementById("fitPhase"),big=document.getElementById("fitBig"),sub=document.getElementById("fitSub");if(!ph)return;
 const colors={work:"#f4a8a8",rest:"#cfe3f2",done:"#cde8d2",ready:"#f0e9dd"};const labels={work:"🔴 训练中",rest:"🔵 休息",done:"✅ 完成",ready:"准备"};
 const st=fitTimer.phase==="done"?"done":(fitTimer.running?fitTimer.phase:"ready");
 ph.textContent=labels[st];ph.style.background=colors[st];
 if(st==="done"){big.textContent="全部完成 💪";sub.textContent="去打卡 +10 XP";}
 else if(st==="ready"){big.textContent=fitTimer.sets+" 组 × "+fmtSec(fitTimer.work);sub.textContent="第 0/"+fitTimer.sets+" 组 · 休息 "+fitTimer.rest+"s";}
 else{big.textContent=fmtSec(Math.max(0,fitTimer.remaining));sub.textContent="第 "+Math.min(fitTimer.setIdx+(fitTimer.phase==="rest"?1:1),fitTimer.sets)+"/"+fitTimer.sets+" 组 · "+(fitTimer.phase==="work"?"训练中":"休息");}}
function beep(freq){try{if(!window.AudioContext&&!window.webkitAudioContext)return;const C=window.AudioContext||window.webkitAudioContext;const ctx=beep._c||(beep._c=new C());const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);g.gain.value=0.06;o.start();setTimeout(()=>o.stop(),160);}catch(e){}}

let _tess=null;
function loadTesseract(){if(_tess)return Promise.resolve(_tess);return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=()=>{try{_tess=Tesseract;res(Tesseract);}catch(e){rej(e);}};s.onerror=()=>rej(new Error("OCR 脚本加载失败（需联网）"));document.head.appendChild(s);});}
function runOCR(i){const f=document.getElementById("ocrFile");if(!f||!f.files||!f.files[0]){toast("先选一张图片");return;}const st=document.getElementById("ocrStatus");if(st)st.textContent="识别中…（首次需下载语言包，稍候）";loadTesseract().then(T=>{T.recognize(f.files[0],{},{logger:function(){}}).then(function(res){const txt=res.data.text.trim();const ta=document.getElementById("bkExcerpt");if(ta)ta.value=(ta.value?ta.value+"\n":"")+txt;saveExcerpt(i);if(st)st.textContent="✅ 识别完成，已填入摘录";toast("OCR 识别完成");}).catch(function(e){if(st)st.textContent="识别失败："+e.message;});}).catch(function(e){if(st)st.textContent="OCR 初始化失败："+e.message;toast("OCR 需要联网加载");});}
function translateSel(i){const ta=document.getElementById("bkExcerpt");if(!ta)return;const sel=(ta.value.substring(ta.selectionStart,ta.selectionEnd)||"").trim();if(!sel){toast("先在摘录里用鼠标选中一句");return;}const out=document.getElementById("trOut");if(out)out.textContent="翻译中…";const cjk=/[一-鿿]/.test(sel);const pair=cjk?"zh|en":"en|zh";fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(sel)+"&langpair="+pair).then(function(r){return r.json();}).then(function(j){if(j&&j.responseData&&j.responseData.translatedText){if(out)out.textContent="🌐 "+(cjk?"EN: ":"中: ")+j.responseData.translatedText;}else{openTranslate(sel,cjk);}}).catch(function(){openTranslate(sel,cjk);});}
function openTranslate(t,cjk){window.open("https://fanyi.baidu.com/#"+(cjk?"zh/en/":"en/zh/")+encodeURIComponent(t),"_blank");}

function renderKnowledge(main){
 const arr=S.knowledge||[];
 const cats=new Set(arr.map(x=>x.cat).filter(Boolean)).size;
 const due=reviewDue();
 const mature=arr.filter(x=>(x.interval||0)>=21).length;
 const qc=document.createElement("div");qc.className="card";
 let qh=`<h2>🧠 知识库 · 间隔复习</h2>
  <div class="stat-strip" style="margin-top:6px">
   <div class="stat"><b>${arr.length}</b><span>主题</span></div>
   <div class="stat"><b>${cats}</b><span>分类</span></div>
   <div class="stat"><b>${due.length}</b><span>今日待复习</span></div>
   <div class="stat"><b>${mature}</b><span>已掌握</span></div>
  </div>`;
 if(due.length){
  qh+=`<div style="margin-top:12px;font-size:13px;color:var(--muted);font-weight:bold">🔔 今日复习队列（${due.length}）</div><div style="margin-top:6px">`+
   due.map(k=>{const i=arr.indexOf(k);const iv=Math.max(1,k.interval||0);
    return `<div class="kcard" onclick="openReview(${i})">
     <div style="font-weight:bold;color:var(--accent-ink)">${esc(k.topic||"")}</div>
     <div style="font-size:11px;color:var(--muted)">${esc(k.cat||"")} · 间隔 ${iv} 天${k.due&&k.due<todayStr()?" · <span style='color:var(--bad)'>逾期</span>":""}</div>
    </div>`;}).join("")+`</div>`;
 }else{
  qh+=`<div style="margin-top:12px;color:var(--ok);font-size:13px">🎉 今天没有待复习的，去下方「新增知识」补充或复习已掌握项吧。</div>`;
 }
 qc.innerHTML=qh;main.appendChild(qc);
 renderSimple(main);
}
function reviewDue(){const t=todayStr();return (S.knowledge||[]).filter(k=>!k.due||k.due<=t);}
function openReview(i){const k=S.knowledge[i];if(!k)return;
 const html=`<div style="font-size:13px;color:var(--accent-ink);margin-bottom:6px"><b>${esc(k.topic||"")}</b> · ${esc(k.cat||"")}</div>
  <div style="background:#fff7e8;border:2px dashed #e0b96a;border-radius:10px;padding:10px;font-size:14px;color:var(--accent-ink);margin-bottom:10px">${esc(k.q||k.note||"（无问题，凭记忆回顾这条笔记）")}</div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:6px">凭记忆回想后，选择掌握程度：</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
   <button class="btn sm" style="background:#fde2e0;color:var(--bad)" onclick="gradeKnowledge(${i},'again')">😵 忘了</button>
   <button class="btn sm" style="background:#fcebc2" onclick="gradeKnowledge(${i},'hard')">😅 吃力</button>
   <button class="btn sm green" onclick="gradeKnowledge(${i},'good')">🙂 不错</button>
   <button class="btn sm" style="background:#cde8d2" onclick="gradeKnowledge(${i},'easy')">😎 轻松</button>
  </div>`;
 openDModal("🧠 复习："+esc(k.topic||""),html);}
function gradeKnowledge(i,g){const k=S.knowledge[i];if(!k)return;
 const today=todayStr();let iv=k.interval||0,reps=k.reps||0,ease=k.ease||2.5;
 if(g==="again"){iv=1;reps=0;ease=Math.max(1.3,ease-0.2);}
 else if(g==="hard"){iv=reps===0?1:Math.max(1,Math.round(iv*1.2));reps=Math.max(1,reps);ease=Math.max(1.3,ease-0.15);}
 else if(g==="good"){iv=reps===0?1:Math.round(iv*2.5);reps+=1;ease=Math.min(3.0,ease+0.05);}
 else if(g==="easy"){iv=reps===0?4:Math.round(iv*3.5);reps+=1;ease=Math.min(3.2,ease+0.15);}
 k.interval=iv;k.reps=reps;k.ease=Math.round(ease*100)/100;k.last=today;k.due=addDaysStr(today,iv);
 save();closeDModal();render();toast("已记录 · 下次复习 "+k.due);}
function addDaysStr(dateStr,n){const d=new Date(dateStr);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function openKnowledgeEdit(i){const k=S.knowledge[i];if(!k)return;
 const html=`<div style="font-size:13px;color:var(--accent-ink);margin-bottom:6px">编辑知识条目</div>

 openDModal("🧠 编辑知识",html);}
function saveKnowledge(i){const k=S.knowledge[i];if(!k)return;

let SW_FILTER={},SW_TAG={};
function renderSimple(main){

  social:{t:"📱 自媒体矩阵",searchLabel:"账号/平台",tagKey:"platform",tagLabel:"平台",searchKeys:["platform","name","freq","fans","note"],

   stat:arr=>`<div class="stat"><b>${arr.reduce((a,x)=>a+(parseInt(x.words)||0),0).toLocaleString()}</b><span>总字数</span></div><div class="stat"><b>${arr.filter(x=>x.status==="已发布").length}</b><span>已发布</span></div><div class="stat"><b>${arr.filter(x=>x.status==="写作中").length}</b><span>写作中</span></div>`},
  knowledge:{t:"🧠 知识库索引",searchLabel:"主题",tagKey:"cat",tagLabel:"分类",searchKeys:["topic","cat","src","note"],
   stat:arr=>`<div class="stat"><b>${arr.length}</b><span>主题数</span></div><div class="stat"><b>${new Set(arr.map(x=>x.cat).filter(Boolean)).size}</b><span>分类数</span></div>`}
 };
 const m=map[view];if(!S[view])S[view]=[];

 c.innerHTML=`<h2>${m.t}</h2><div class="stat-strip">${m.stat(S[view])}</div>`;main.appendChild(c);

 let html=`<input class="search" id="swSearch" placeholder="🔍 搜索${m.searchLabel}…" value="${esc(SW_FILTER[view]||"")}">`;
 if(m.tagKey){
  const tags=[...new Set(S[view].map(x=>x[m.tagKey]).filter(Boolean))];
  html+=`<div class="chips" id="swTags">${tags.map(t=>`<span class="tagchip${SW_TAG[view]===t?' active':''}" data-t="${esc(t)}">${esc(t)}</span>`).join("")||'<span style="font-size:12px;color:var(--muted)">暂无标签可筛选</span>'}</div>`;
 }
 f.innerHTML=html;main.appendChild(f);
 const list=document.createElement("div");list.id="swList";main.appendChild(list);
 renderSimpleList(view,m);
 const sb=document.getElementById("swSearch");if(sb)sb.oninput=e=>{SW_FILTER[view]=e.target.value;renderSimpleList(view,m);};
 document.querySelectorAll("#swTags .tagchip").forEach(ch=>ch.onclick=()=>{const t=ch.dataset.t;SW_TAG[view]=SW_TAG[view]===t?"":t;
  document.querySelectorAll("#swTags .tagchip").forEach(x=>x.classList.toggle("active",x.dataset.t===SW_TAG[view]));renderSimpleList(view,m);});

function renderSimpleList(view,m){
 const list=document.getElementById("swList");if(!list)return;
 const arr=S[view]||[];const q=(SW_FILTER[view]||"").trim().toLowerCase();const tag=SW_TAG[view]||"";
 const filtered=arr.filter(it=>{const hay=(m.searchKeys||[]).map(k=>it[k]||"").join(" ").toLowerCase();const okQ=!q||hay.includes(q);const okT=!tag||(it[m.tagKey]===tag);return okQ&&okT;});
 if(view==="writing"){
  const cols=["灵感","写作中","已发布"];const maxW=Math.max(1,...filtered.map(it=>+(it.words||0)));
  if(!filtered.length){list.innerHTML=`<div style="color:var(--muted);font-size:13px;padding:8px">暂无匹配作品，下面添加一条吧。</div>`;return;}

     ${w>0?`<div class="w"><i style="width:${w}%"></i></div>`:""}

 }
 if(!filtered.length){list.innerHTML=`<div style="color:var(--muted);font-size:13px;padding:8px">没有匹配项，调整搜索或标签。</div>`;return;}

let focusState={total:25*60,remaining:25*60,running:false,iv:null};
function todayFocus(){return (S.focus||[]).filter(d=>d===todayStr()).length;}
function focusToggle(){
 if(focusState.running){focusState.running=false;clearInterval(focusState.iv);paintFocus();return;}
 focusState.running=true;
 if(focusState.remaining<=0)focusState.remaining=focusState.total;
 paintFocus();
 focusState.iv=setInterval(()=>{
  focusState.remaining--;
  if(focusState.remaining<=0){
   clearInterval(focusState.iv);focusState.running=false;focusState.remaining=focusState.total;
   S.focus.push(todayStr());S.checkinXp+=5;save();
   toast("🍅 专注完成 +5 XP");confetti();if(navigator.vibrate)navigator.vibrate([40,30,40]);paintFocus();
   const cnt=document.getElementById("fCount");if(cnt)cnt.textContent=todayFocus();
  }else paintFocus();
 },1000);
}
function focusReset(){focusState.running=false;clearInterval(focusState.iv);focusState.remaining=focusState.total;paintFocus();}
function paintFocus(){
 const total=focusState.total,rem=focusState.remaining;
 // 卡片内环（r=60）
 const r1=60,circ1=2*Math.PI*r1;
 const arc=document.getElementById("fArc");
 if(arc){arc.style.strokeDasharray=circ1+" "+circ1;arc.style.strokeDashoffset=circ1*(1-Math.max(0,rem)/total);}
 const t=document.getElementById("fTime");
 if(t){const m=Math.floor(rem/60),s=rem%60;t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
 const btn=document.getElementById("fToggle");
 if(btn)btn.textContent=focusState.running?"⏸ 暂停":"▶ 开始";
 // 沉浸大环（r=104）
 const r2=104,circ2=2*Math.PI*r2;
 const arc2=document.getElementById("fArc2");
 if(arc2){arc2.style.strokeDasharray=circ2+" "+circ2;arc2.style.strokeDashoffset=circ2*(1-Math.max(0,rem)/total);}
 const t2=document.getElementById("fTime2");
 if(t2){const m=Math.floor(rem/60),s=rem%60;t2.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
 const btn2=document.getElementById("fToggle2");
 if(btn2)btn2.textContent=focusState.running?"⏸ 暂停":"▶ 开始";
}
function openFocusOverlay(){const o=document.getElementById("focusOverlay");if(o)o.classList.add("show");paintFocus();if(navigator.vibrate)navigator.vibrate(30);}
function closeFocusOverlay(){const o=document.getElementById("focusOverlay");if(o)o.classList.remove("show");}

// ---------- 习惯热力图 ----------
function heatmapHtml(datesArr,weeks){
 const set=new Set(datesArr||[]);
 const today=new Date();const days=weeks*7;
 const start=new Date(today);start.setDate(today.getDate()-(days-1));
 let cells="";
 for(let i=0;i<days;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  const on=set.has(key);
  const future=d>today;
  cells+=`<div class="heat-cell${on?' on':''}" style="${future?'opacity:.35':''}" title="${key}${on?' ✅':''}"></div>`;
 }
 return `<div class="heat">${cells}</div>`;
}

document.getElementById("ckSave").onclick=async()=>{

   document.getElementById("ckStatus").textContent="✅ 已自动新建 Bin："+bin;
  }catch(e){document.getElementById("ckStatus").textContent="❌ 建 Bin 失败："+e.message;return;}
 }
 localStorage.setItem(CLOUD_KEY,k);localStorage.setItem(CLOUD_BIN,bin);
 document.getElementById("ckBin").value=bin;
 setCloudStatus("已连接 ☁","ok");
 await cloudPull(true);
 toast("云同步已开启");
};
