 const def=PVZ_PLANTS.find(function(p){return p.t===t;});if(!def)return;
 if((S.pvz.sun||0)<def.cost){toast("阳光不足，先去完成任务赚阳光吧 🌞");return;}
 S.pvz.sun-=def.cost;
 const slots=[95,88,80,72,64,56,48,40,32,24,16,8];
 const used=(S.pvz.plants||[]).map(function(p){return p.pos;});
 let pos=slots.find(function(s){return used.indexOf(s)<0;});
 if(pos===undefined)pos=10+Math.floor(Math.random()*10);
 S.pvz.plants.push({id:"p"+Date.now()+Math.floor(Math.random()*999),t:def.t,pos:pos,def:def.def,placedAt:Date.now()});
 save();renderPvzBar();toast("已购买 "+def.name+"（拖动可摆放位置，× 撤回退阳光）");
}
function pvzWithdraw(pid){
 const plants=S.pvz.plants||[];
 const i=plants.findIndex(function(x){return x.id===pid;});
 if(i<0)return;
 const p=plants[i];
 const def=PVZ_PLANTS.find(function(x){return x.t===p.t;});
 S.pvz.sun+=(def?def.cost:0);
 plants.splice(i,1);
 save();renderPvzBar();toast("已撤回 "+(def?def.name:"植物")+"，阳光 +"+(def?def.cost:0));
}
function pvzPlantDown(e,el,pid){
 if(pvzDrag)return;
 const track=el.parentNode;
 const rect=track.getBoundingClientRect();
 pvzDrag={pid:pid,el:el,startX:e.clientX,origPct:parseFloat(el.style.left)||0,rect:rect};
 el.classList.add("dragging");
 if(el.setPointerCapture&&e.pointerId!==undefined){try{el.setPointerCapture(e.pointerId);}catch(_){}}
 if(e.preventDefault)e.preventDefault();
}
function pvzPlantMove(e){
 if(!pvzDrag)return;
 const dx=e.clientX-pvzDrag.startX;
 let pct=pvzDrag.origPct+dx/pvzDrag.rect.width*100;
 pct=Math.max(3,Math.min(95,pct));
 pvzDrag.el.style.left=pct+"%";
 const shop=document.querySelector(".pvz-shop");
 if(shop){const sr=shop.getBoundingClientRect();const over=e.clientY>sr.top-12&&e.clientX>sr.left&&e.clientX<sr.right;pvzDrag.el.classList.toggle("will-withdraw",over);}
 if(e.preventDefault)e.preventDefault();
}
function pvzPlantUp(e){
 if(!pvzDrag)return;
 const pid=pvzDrag.pid,el=pvzDrag.el;
 el.classList.remove("dragging");
 const shop=document.querySelector(".pvz-shop");
 let withdraw=false;
 if(shop){const sr=shop.getBoundingClientRect();withdraw=e.clientY>sr.top-12&&e.clientX>sr.left&&e.clientX<sr.right;}
 el.classList.remove("will-withdraw");
 pvzDrag=null;
 if(withdraw){pvzWithdraw(pid);return;}
 const slots=[95,88,80,72,64,56,48,40,32,24,16,8];
 let best=slots[0],bd=1e9;
 const cur=parseFloat(el.style.left)||0;
 for(const s of slots){const d=Math.abs(s-cur);if(d<bd){bd=d;best=s;}}
 const p=(S.pvz.plants||[]).find(function(x){return x.id===pid;});
 if(p){p.pos=best;p.placedAt=Date.now();save();}
 renderPvzBar();
}
function pvzSpawnFx(cls,xPct){

 if(z){const tr=track.getBoundingClientRect();const zr=z.getBoundingClientRect();const px=tr.width*(xPct/100);const zx=zr.left-tr.left+20;dist=Math.max(20,px-zx)+"px";}
 const el=document.createElement("span");el.className=cls;el.style.left=xPct+"%";el.style.setProperty("--fly-dist",dist);

var pvzFxTick=0;
function pvzFxLoop(){
 try{
  const st=pvzSim(Date.now());if(st.arrived){pvzFxTick=0;}
  else{
   pvzFxTick++;
   const plants=S.pvz.plants||[];
   for(const p of plants){
    if(p.pos<st.posPct)continue; // 植物在僵尸左侧才朝左发射
    const def=PVZ_PLANTS.find(function(x){return x.t===p.t;});
    if(!def||def.dmg<=0)continue;
    if(p.t==="pea" && pvzFxTick%2===0)pvzSpawnFx("pvz-pea",p.pos);
    if(p.t==="snow" && pvzFxTick%2===0)pvzSpawnFx("pvz-ice",p.pos);
    if(p.t==="repeater" && pvzFxTick%2===0){pvzSpawnFx("pvz-pea",p.pos);setTimeout(function(){pvzSpawnFx("pvz-pea",p.pos);},180);}
    if(p.t==="corn" && pvzFxTick%3===0)pvzSpawnFx("pvz-corn",p.pos);
    if(p.t==="melon" && pvzFxTick%3===0)pvzSpawnFx("pvz-melon",p.pos);
   }
  }
 }catch(_){}
 setTimeout(pvzFxLoop,900);
}
function pvzAnimLoop(){
 try{
  const z=document.getElementById("pvzZombie");
  if(z){
   const st=pvzSim(Date.now());
   z.style.left=st.posPct+"%";
   z.innerHTML=pvzZombieSprite(st.zType.t,st.hp,st.maxHp,st.slow);
   z.classList.toggle("z-eating",false);
   const plants=S.pvz.plants||[];
   for(const p of plants){
    const pe=document.querySelector('.pvz-plant[data-pid="'+p.id+'"]');
    if(!pe)continue;
    const simP=st.plants.find(function(s){return s.id===p.id;});
    const eating=!!(simP&&simP.eaten<simP.def&&p.pos<=st.posPct+0.8);
    pe.classList.toggle("eating",eating);
    if(eating)z.classList.add("z-eating");
   }
  }
 }catch(_){}
 pvzRAF=setTimeout(pvzAnimLoop,240);
}

function pvzDailyCheckin(){
 pvzRollDay();
 if(S.pvz.checkedIn===todayStr())return;
 S.pvz.checkedIn=todayStr();
 pvzAward(20,"每日首次进入工作台");
 if(!S.checkinDays.includes(todayStr()))S.checkinDays.push(todayStr());
 S.checkinXp=(S.checkinXp||0)+20;S.lastCheckin=todayStr();
 save();
 toast("🌅 每日签到 +20 阳光已注入向日葵");
}
function pvzToggleCollapse(){
 S.pvz.collapsed=!S.pvz.collapsed;save();renderPvzBar();
}
function renderPvzBar(){
 if(pvzDrag)return;
 const el=document.getElementById("pvzBar");if(!el)return;
 if(view==="splash"){el.style.display="none";return;}
 el.style.display="block";
 const collapsed=!!S.pvz.collapsed;
 el.classList.toggle("pvz-collapsed",collapsed);
 const now=Date.now();
 const st=pvzSim(now);
 const sun=S.pvz.sun||0;
 const shop=(S.pvz.shop||[]).map(function(s){const d=PVZ_PLANTS.find(function(p){return p.t===s.t;});const can=sun>=d.cost;return `<button class="pvz-shop-card${can?' on':''}" onclick="pvzBuy('${d.t}')" title="${esc(d.desc)}">
   <span class="pvz-ico">${pvzPlantSprite(d.t)}</span><span class="pvz-nm">${esc(d.name)}</span><span class="pvz-cost">🌞${d.cost}</span></button>`;}).join("");
 const plantEls=(S.pvz.plants||[]).map(function(p){const d=PVZ_PLANTS.find(function(x){return x.t===p.t});const flame=d.t==="jalapeno"?`<span class="flame"></span>`:"";return `<span class="pvz-plant" data-pid="${p.id}" data-type="${d.t}" style="left:${p.pos}%" title="${esc(d.name)}：拖动调整位置，点 × 撤回并退还阳光" onpointerdown="pvzPlantDown(event,this,'${p.id}')">${pvzPlantSprite(d.t)}${flame}<span class="pvz-del" onpointerdown="event.stopPropagation()" onclick="pvzWithdraw('${p.id}')">×</span></span>`;}).join("");
 const hpPct=st.maxHp?Math.max(0,Math.min(100,st.hp/st.maxHp*100)):100;
 const hpColor=hpPct>50?"#67c23a":(hpPct>25?"#e6a23c":"#f56c6c");
 let status,statusCls="pvz-ok";
 if(st.arrived){status="🧟 僵尸已到达！脑子被吃掉了…明天重新种植物抢回来";statusCls="pvz-bad";}
 else if(st.totalDef<=0){status="⚠️ 还没布置植物，僵尸正直奔你的脑子！去做任务赚阳光种植物吧";statusCls="pvz-bad";}
 else{const leftMin=(st.arrivalMin-st.elapsed).toFixed(0);status="🛡 已布置 "+(S.pvz.plants.length)+" 株植物（共阻挡 "+st.totalDef+" 分钟），僵尸距脑子还剩 "+((100-st.posPct)).toFixed(0)+"%，还要 "+(leftMin)+" 分钟才到";statusCls="pvz-ok";}
 const toggleIco=collapsed?"▲":"▼";
 const zName=st.zType?st.zType.name:"普通僵尸";
 el.innerHTML=`<div class="pvz-head"><span class="pvz-title">🧟 每日僵尸防守战 · <span class="pvz-zname" onclick="pvzOpenZombiePrison()">${esc(zName)} ▾</span></span><span style="display:flex;align-items:center"><span class="pvz-sun">🌞 ${sun}</span><button class="pvz-toggle" onclick="pvzToggleCollapse()" title="${collapsed?'展开':'收起'}">${toggleIco}</button></span></div>
  <div class="pvz-track pvz-lawn">
   <span class="pvz-brain">${PVZ_BRAIN}</span>
   <span class="pvz-sunflower">${PVZ_SVG.sun}</span>
   ${plantEls}
   <span class="pvz-zombie" id="pvzZombie" style="left:${st.posPct}%">${pvzZombieSprite(st.zType.t,st.hp,st.maxHp,st.slow)}</span>
  </div>
  <div class="pvz-status ${statusCls}">${status}</div>
  <div class="pvz-hint">💡 拖动植物摆放/挪动位置；把植物拖回下方商店区，或点 ×，可撤回并原数退还阳光。点击标题僵尸名可打开「僵尸监狱」换对手。</div>
  <div class="pvz-shop">${shop}</div>`;
}
function showBrainEaten(){
 if(!S.pvz.pendingBrain||S.pvz.brainShown)return;
 S.pvz.brainShown=true;save();
 const ov=document.createElement("div");ov.id="brainEaten";ov.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(20,10,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;animation:fadeIn .4s";
 ov.innerHTML=`<div style="font-size:60px;animation:brainShake 1s infinite">🧠</div>
  <div style="font-size:40px;margin-top:6px;animation:zombieWalk 3s linear forwards">🧟‍♂️</div>
  <div style="font-size:20px;margin-top:18px;font-weight:700">昨天你没守住防线…</div>
  <div style="font-size:15px;margin-top:8px;opacity:.85">僵尸吃掉了你的脑子 🧟 今天重新种植物，把脑子抢回来！</div>
  <button class="btn" style="margin-top:22px" onclick="document.getElementById('brainEaten').remove()">💪 我知道了，开始今天的反击</button>`;
 document.body.appendChild(ov);
 setTimeout(function(){const o=document.getElementById("brainEaten");if(o)o.remove();},8000);
}
document.getElementById("d").textContent="今天 "+todayStr();
applyTheme();updateWbTitle();
if(window.matchMedia){try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if((S.settings&&S.settings.theme)==="auto")applyTheme();});}catch(e){}}
pvzRollDay();pvzDailyCheckin();pvzTickSun();render();showBrainEaten();
document.addEventListener("pointermove",pvzPlantMove);
document.addEventListener("pointerup",pvzPlantUp);
document.addEventListener("pointercancel",pvzPlantUp);
pvzAnimLoop();pvzFxLoop();
setInterval(function(){try{pvzTickSun();renderPvzBar();}catch(e){}},30000);
initSearch();
initCloudSync();
if('serviceWorker' in navigator){const SW_VER='7';const SW_URL='sw.js?v='+SW_VER;window.addEventListener('load',()=>{(async()=>{try{
  // 强制清掉任何旧版 SW 注册（尤其未带 ?v= 的旧 sw.js），否则 Chrome 24h 节流会卡在旧版
  const regs=await navigator.serviceWorker.getRegistrations();
  for(const r of regs){const u=(r.active&&r.active.scriptURL)||(r.installing&&r.installing.scriptURL)||'';if(u&&u.indexOf('?v='+SW_VER)<0){try{await r.unregister();}catch(e){}}}
  const reg=await navigator.serviceWorker.register(SW_URL);if(reg)try{reg.update();}catch(e){}
 }catch(e){}})();});
 let wbSwRefreshing=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(wbSwRefreshing)return; wbSwRefreshing=true; location.reload(); });
}
// PWA 安装到桌面 / 开始菜单
let wbDeferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();wbDeferredPrompt=e;pwaRefreshBtn();});
window.addEventListener('appinstalled',()=>{wbDeferredPrompt=null;pwaRefreshBtn(true);});
function pwaRefreshBtn(installed){
 const btn=document.getElementById('pwaInstallBtn');const hint=document.getElementById('pwaHint');
 if(!btn)return;
 if(installed||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)){
  btn.style.display='none';if(hint)hint.textContent='✅ 已安装为桌面应用，可在开始菜单 / 任务栏找到它。';return;
 }
 if(wbDeferredPrompt){btn.style.display='';if(hint)hint.textContent='点上方按钮即可安装（仅 HTTPS / localhost 下可用，本地双击打开的 file:// 文件无法安装，请改用已部署的网址）。';}
 else{btn.style.display='none';if(hint)hint.textContent='当前浏览器未提供安装入口：请用 Edge / Chrome 打开本应用的网址，地址栏会出现「安装」图标；或在「设置 → 应用」里手动安装。';}
}
function pwaInstall(){
 if(wbDeferredPrompt){wbDeferredPrompt.prompt();wbDeferredPrompt.userChoice.then(()=>{wbDeferredPrompt=null;pwaRefreshBtn();});}
 else if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){toast('请改用已部署的 HTTPS 网址打开，或用 Edge/Chrome 地址栏的「安装」按钮');}
}
setTimeout(pwaRefreshBtn,800);
</script>
