<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的闯关工作台</title>
<meta name="theme-color" content="#9c5b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js" crossorigin></script>
<style>
:root{
 --bg:oklch(94% 0.012 90);--paper:oklch(94% 0.012 90);--card:oklch(98.5% 0.006 90);--card2:oklch(96.5% 0.008 90);
 --ink:oklch(30% 0.01 150);--ink2:oklch(45% 0.01 150);--muted:oklch(62% 0.008 150);
 --accent:oklch(56% 0.055 215);--accent-weak:oklch(94% 0.022 215);--accent-ink:oklch(42% 0.055 215);
 --red:oklch(66% 0.06 25);--red2:oklch(48% 0.12 25);--purple:oklch(60% 0.05 300);--warm:oklch(55% 0.10 60);
 --line:oklch(90% 0.01 90);--line-dash:oklch(86% 0.012 90);--track:oklch(93% 0.008 90);--ok:oklch(50% 0.07 150);--bad:oklch(50% 0.13 25);
 --yellow:oklch(94% 0.04 90);--pink:oklch(93% 0.03 20);--green:oklch(93% 0.04 150);--blue:oklch(93% 0.04 220);--lilac:oklch(93% 0.03 300);--orange:oklch(93% 0.04 60);
 --radius:14px;--shadow:0 2px 10px rgba(60,50,40,.06);--card-opacity:100%;
 --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
 --fs-xs:.75rem;--fs-sm:.8125rem;--fs-base:1rem;--fs-lg:1.25rem;--fs-xl:1.6rem;--fs-2xl:2.2rem;
 --radius-sm:8px;--radius-md:12px;--radius-lg:18px;
 --shadow-sm:0 1px 3px rgba(60,50,40,.05);--shadow-md:0 6px 20px rgba(60,50,40,.08)
}
[data-theme="dark"]{
 --bg:oklch(22% 0.008 90);--paper:oklch(22% 0.008 90);--card:oklch(27% 0.008 90);--card2:oklch(25% 0.008 90);
 --ink:oklch(92% 0.006 90);--ink2:oklch(80% 0.006 90);--muted:oklch(65% 0.006 90);
 --accent:oklch(72% 0.05 215);--accent-weak:oklch(30% 0.03 215);--accent-ink:oklch(85% 0.04 215);
 --red:oklch(70% 0.06 25);--red2:oklch(68% 0.10 25);--purple:oklch(72% 0.05 300);--warm:oklch(74% 0.08 60);
 --line:oklch(32% 0.008 90);--line-dash:oklch(38% 0.01 90);--track:oklch(25% 0.008 90);--ok:oklch(72% 0.08 150);--bad:oklch(70% 0.12 25);
 --yellow:oklch(30% 0.03 90);--pink:oklch(30% 0.03 20);--green:oklch(28% 0.04 150);--blue:oklch(28% 0.04 220);--lilac:oklch(30% 0.03 300);--orange:oklch(30% 0.04 60);
 --shadow:0 2px 12px rgba(0,0,0,.3);--card-opacity:100%;
 --shadow-sm:0 1px 3px rgba(0,0,0,.25);--shadow-md:0 6px 20px rgba(0,0,0,.4)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);
 font-family:-apple-system,"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;padding:12px 12px 80px}
header{position:relative;text-align:center;margin-bottom:8px}
header h1{font-size:24px;font-weight:700;margin:2px 0;color:var(--accent);letter-spacing:-.3px}
.tape{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);width:120px;height:20px;background:repeating-linear-gradient(45deg,#f4c7c3,#f4c7c3 8px,#f8d2a8 8px,#f8d2a8 16px);opacity:.85;border-radius:3px}
.date{display:inline-block;background:var(--yellow);padding:2px 12px;border-radius:18px;font-size:12px}
.banner{position:sticky;top:0;z-index:30;background:var(--card2);border:2px dashed var(--accent);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px;color:var(--accent-ink);box-shadow:var(--shadow)}
.app{display:flex;gap:10px;align-items:flex-start}
.app.nav-collapsed{gap:0}
.nav{width:132px;flex:0 0 auto;min-width:0;display:flex;flex-direction:column;gap:6px;transition:width .2s,opacity .2s}
.nav.collapsed{width:0;padding:0;border:none;overflow:hidden;opacity:0;flex-basis:0;gap:0}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;min-height:46px;border:2px dashed var(--line);border-radius:12px;background:var(--card);color:var(--ink2);font-family:inherit;font-size:14px;cursor:pointer;transition:.15s}
.nav button .ico{width:20px;height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.nav button .ico svg{width:20px;height:20px}
.nav button .lbl{flex:1;white-space:nowrap;overflow:hidden}
.nav button.active{background:var(--accent-weak);color:var(--accent-ink);border-color:var(--accent);border-left:3px solid var(--accent)}
.nav.collapsed button .lbl{display:none}
.nav button:hover{border-color:var(--accent)}
.main{flex:1;min-width:0}
.card{background:color-mix(in srgb,var(--card) var(--card-opacity),transparent);border:2px dashed var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
#bgLayer{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;transition:opacity .25s,filter .25s}
.card h2{font-size:20px;font-weight:700;margin:0 0 8px;color:var(--accent);letter-spacing:-.2px}
.card h3{font-size:16px;color:var(--ink2);margin:10px 0 4px}
.sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sub button{padding:5px 10px;border:2px dashed var(--line);border-radius:10px;background:#fffdfa;font-family:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
.sub button.active{background:var(--lilac);color:#5a3a6a;border-color:#c9a9d8}
/* status */
.hero{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.plant{width:96px;height:112px;flex:0 0 auto}
.lvbox{flex:1;min-width:180px}
.lv b{font-size:20px;font-weight:700;color:var(--bad)}
.xpbar{height:14px;background:#f0e9dd;border-radius:9px;overflow:hidden;margin:4px 0}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#8fd0a0,#5fae74);transition:width .5s}
.xptxt{font-size:11px;color:var(--muted)}
/* quest */
.qtitle{font-weight:bold;color:var(--accent-ink)}
.reward{font-size:12px;color:var(--warm);background:var(--yellow);border-radius:8px;padding:5px 9px;margin:6px 0;transform:rotate(-.3deg)}
.ring{width:50px;height:50px;border-radius:50%;background:conic-gradient(#8fd0a0 calc(var(--p)*1%),#eee 0);display:flex;align-items:center;justify-content:center;font-size:11px;color:#5fae74;flex:0 0 auto}
.task{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dotted #ece3d6}
.cb{width:20px;height:20px;border:2px solid #c9bcae;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5fae74;background:#fff;flex:0 0 auto}
.task.done .cb{background:#cde8d2;border-color:#8fd0a0}
.task.done .txt{text-decoration:line-through;color:#aab}
.txt{flex:1}.xp{font-size:11px;color:var(--warm);background:var(--orange);border-radius:10px;padding:1px 7px;flex:0 0 auto}
.add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.add input,.add select{padding:6px 8px;border:2px dashed var(--line);border-radius:9px;font-family:inherit;font-size:12px;background:#fffdfa;flex:1;min-width:120px}
.btn{padding:9px 14px;min-height:44px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
.btn.sm{padding:5px 12px;font-size:13px;min-height:38px}.btn.alt{background:var(--accent-weak);color:var(--accent-ink)}.btn.green{background:#7fae8c}.btn.ghost{background:var(--card);color:var(--accent-ink);border:2px dashed var(--accent)}
/* stages */
.stagecur{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stagecur button{padding:4px 9px;border-radius:10px;border:2px solid var(--line);background:#fffdfa;font-family:inherit;font-size:12px;cursor:pointer}
.stagecur button.active{background:#cde8d2;border-color:#8fd0a0;color:var(--ok);font-weight:bold}
.remind{background:var(--blue);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.pit{background:#fde2c4;border-radius:10px;padding:8px 10px;font-size:12px;margin:6px 0;color:#9a5a1d}
.stampmini{display:inline-block;font-size:12px;background:#cde8d2;border-radius:10px;padding:2px 9px;color:var(--ok)}
/* tables */
.tbl{border-collapse:collapse;width:100%;font-size:12px;margin-top:4px}
.tbl th{background:#9aa0a6;color:#fff;padding:5px 6px;text-align:left;font-weight:normal}
.tbl td{border:1px solid #ece3d6;padding:5px 6px;vertical-align:top}
.tbl td[contenteditable]{background:#fffdfa;outline:none}
.tbl td[contenteditable]:focus{background:#fff7e8}
.x{cursor:pointer;color:var(--red);font-weight:bold;padding:0 4px}
.addrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.addrow input{flex:1;min-width:80px;padding:5px 7px;border:2px dashed var(--line);border-radius:8px;font-family:inherit;font-size:12px}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fffdfa;cursor:pointer;padding:4px;overflow:hidden;text-align:center}
.stamp .seal{font-size:clamp(12px,5vw,22px);filter:grayscale(1);opacity:.35;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.stamp.on{border-color:var(--red);background:#fff4f1}.stamp.on .seal{filter:none;opacity:1;animation:stampin .5s;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
@keyframes stampin{0%{transform:scale(2.4) rotate(-18deg);opacity:0}60%{transform:scale(.9) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg)}}
/* morning */
.morning{background:#fff7e8;border:2px dashed #e0b96a;border-radius:12px;padding:10px;font-size:13px;line-height:1.7;white-space:pre-wrap}
.morning .h{font-weight:700;color:var(--warm);font-size:16px;margin-bottom:4px;letter-spacing:-.2px}
textarea.note{width:100%;min-height:50px;border:2px dashed var(--line);border-radius:9px;font-family:inherit;font-size:12px;padding:6px;background:#fffdfa}
.field-in{padding:5px 8px;border:2px dashed var(--line);border-radius:8px;font-family:inherit;font-size:12px;background:#fffdfa;color:var(--ink);min-width:80px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;background:rgba(150,120,90,.14);color:var(--warm);margin:1px 3px 1px 0}
.tag.ok{background:rgba(60,107,74,.16);color:var(--ok)}
.tag.warn{background:rgba(217,154,60,.20);color:#c98a2c}
.tag.bad{background:rgba(176,48,33,.16);color:var(--bad)}
.note-txt{font-size:12px;color:var(--muted);margin-top:6px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.float{position:fixed;font-weight:700;color:#5fae74;font-size:18px;pointer-events:none;animation:floatup 1s forwards;z-index:50}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
.confetti{position:fixed;top:-10px;width:8px;height:13px;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:rgba(60,40,40,.45);display:none;align-items:center;justify-content:center;z-index:80}
.modal.show{display:flex}
.box{background:var(--card);border:3px dashed var(--accent);border-radius:18px;padding:20px;max-width:300px;text-align:center;box-shadow:var(--shadow);animation:pop .4s}
.box.wide{max-width:440px;text-align:left;max-height:80vh;overflow:auto;transition:max-width .35s ease,max-height .35s ease}
.box.expand{max-width:92vw;max-height:92vh}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.box .big{font-size:42px}.box h3{font-weight:700;color:var(--accent-ink);margin:6px 0;letter-spacing:-.2px}.box p{font-size:13px;color:var(--accent-ink)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:90}
.toast.show{opacity:1}
/* ---- 云同步 UI ---- */
.cloud-status{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--card);border:2px dashed var(--accent);color:var(--accent-ink);white-space:nowrap}
.cloud-status.off{background:#f3ede4;color:#a08a7e}
.cloud-status.ok{background:#eaf5ee;border-color:#7fae8c;color:#3f7a55}
.cloud-status.syncing{background:#fff7e6;border-color:#e0b15a;color:#a9772a}
.cloud-status.err{background:#fdecec;border-color:#d98b8b;color:#b14b4b}
.ck-lbl{display:block;font-size:12px;color:var(--accent-ink);margin:10px 0 4px;font-weight:bold}
.ck-inp{width:100%;box-sizing:border-box;padding:8px 10px;border:2px solid #e3d6c6;border-radius:10px;font-family:inherit;font-size:13px;color:#5a3b36;background:#fffdfa}
.ck-inp:focus{outline:none;border-color:var(--red)}
.ck-status{font-size:12px;margin:10px 0;min-height:16px;color:var(--accent-ink)}
.ck-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ck-btns .btn{flex:1 1 auto}
.ck-hint{font-size:11px;color:#b09a8e;line-height:1.5;margin-top:6px}
/* overview stat strip */
.stat-strip{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.stat{flex:1 1 120px;min-width:0;background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:8px 6px;text-align:center;overflow:hidden}
.stat b{display:block;font-size:18px;color:var(--accent-ink);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;min-height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 卡片可折叠（电脑版长卡片） */
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none}
.card-head .chev{transition:transform .18s ease;font-size:13px;color:var(--muted);flex:0 0 auto}
.card.collapsed>.card-head .chev{transform:rotate(-90deg)}
.card.collapsed>.card-body{display:none}
.card-head:hover{opacity:.82}
/* quote / energy */
.quote{background:linear-gradient(135deg,#fff7e8,#fdeef3);border:2px dashed #e0b96a;border-radius:12px;padding:12px;font-size:14px;color:var(--accent-ink);line-height:1.7}
.quote .q{font-weight:600;color:var(--warm);font-size:16px;margin-bottom:4px;letter-spacing:-.2px}
/* focus timer */
.focus{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;margin:10px 0}
.focus-circle{position:relative;width:140px;height:140px}
.focus-circle .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.focus-circle .t .tm{font-size:26px;font-weight:700;color:var(--accent-ink);letter-spacing:-.5px}
.focus-btns{display:flex;gap:8px;flex-wrap:wrap}
/* heatmap (github style) */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding:4px 0}
.heat-cell{width:13px;height:13px;border-radius:3px;background:#f0e9dd}
.heat-cell.on{background:#8fd0a0}
.heat-cell.on2{background:#5fae74}
.heat-legend{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.heat-legend i{display:inline-block;width:11px;height:11px;border-radius:3px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kanban-col{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:80px}
.kanban-col h4{margin:0 0 6px;font-size:12px;color:var(--accent-ink);text-align:center}
.kanban-card{background:#fff; border:1px solid #ece3d6;border-radius:9px;padding:7px;margin-bottom:6px;font-size:12px;color:var(--accent-ink);cursor:pointer;box-shadow:1px 1px 0 rgba(0,0,0,.04)}
.kanban-card .w{height:6px;background:#f0e9dd;border-radius:4px;margin-top:5px;overflow:hidden}
.kanban-card .w i{display:block;height:100%;background:#8fd0a0}
/* social card */
.social-card{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;position:relative}
.social-card .pf{font-weight:bold;color:var(--accent-ink);font-size:15px}
.social-card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 0}
.tagchip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;background:#e3d4f0;color:#5a3a6a;cursor:pointer;margin:2px}
.tagchip.active{background:var(--accent);color:#fff}
.search{width:100%;padding:7px 9px;border:2px dashed var(--line);border-radius:9px;font-family:inherit;font-size:13px;background:#fffdfa;margin-bottom:8px}
/* renovation overall progress */
.overall{height:16px;background:#f0e9dd;border-radius:9px;overflow:hidden;margin:6px 0}
.overall i{display:block;height:100%;background:linear-gradient(90deg,#8fd0a0,#5fae74)}
/* renovation gantt */
.gantt{display:flex;height:34px;border-radius:8px;overflow:hidden;border:2px solid var(--line);margin-top:8px;position:relative}
.g-seg{display:flex;align-items:center;justify-content:center;font-size:12px;color:#5a3a2a;border-right:1px solid #fffdfa;min-width:0;overflow:hidden}
.g-now{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad)}
.g-now::after{content:"今";position:absolute;top:-15px;left:-7px;font-size:10px;color:var(--bad);font-weight:bold}
/* budget warning */
.warnbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:12px;font-size:13px;margin-bottom:10px}
.warnbar.over{background:#fceae8;border:2px solid #e7a59f}
.warnbar.ok{background:#eaf6ed;border:2px solid #a9d8b8}
.warnbar b{font-size:15px}
/* pie */
.pie-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pie-legend{flex:1;min-width:160px;font-size:12px}
.pie-legend div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted #ece3d6}
.pie-legend .hot{color:var(--bad);font-weight:bold}
@media(max-width:680px){.kanban{grid-template-columns:1fr}}
/* renovation acceptance */
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:4px;vertical-align:middle}
.badge-key{background:#f4c7c3;color:#8e2525}
.badge-imp{background:#fcebc2;color:#9a5a1d}
.badge-nor{background:#e9e9e9;color:#666}
.badge-type{background:#cfe3f2;color:#3a5a7a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:11px;padding:4px 9px;border-radius:10px;background:#fff7e8;border:2px dashed #e0b96a;color:var(--accent-ink)}
.guide summary{cursor:pointer;color:var(--accent-ink);font-size:13px;font-weight:bold}
.guide ul{margin:6px 0;padding-left:18px;font-size:12px;color:var(--accent-ink);line-height:1.6}
.guide .defect-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.guide .defect-item{background:#fffdfa;border:2px dashed var(--line);border-radius:10px;padding:6px 9px;font-size:12px;flex:1;min-width:120px}
.metrics{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.metric{display:flex;gap:8px;background:#fffdfa;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.metric b{color:var(--accent-ink);flex:0 0 88px}
.metric span{color:var(--accent-ink)}
.defect{background:#fffdfa;border:2px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:8px;border-left:5px solid #f4c7c3;position:relative}
.defect-status-0{border-left-color:#f4c7c3}

.home-statusbar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
/* ---- 植物大战僵尸 防守条 ---- */
.pvz-wrap{position:sticky;top:0;z-index:40;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:8px 10px;margin:6px 0 10px;box-shadow:var(--shadow)}
.pvz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pvz-title{font-size:13px;font-weight:700;color:var(--accent-ink)}
.pvz-zname{cursor:pointer;color:var(--warm);border-bottom:1px dashed var(--warm)}
.pvz-zname:hover{color:var(--accent);border-color:var(--accent)}
.pvz-sun{font-size:13px;font-weight:700;color:var(--warm);background:var(--yellow);border-radius:14px;padding:2px 10px}
.pvz-track{position:relative;height:62px;background:repeating-linear-gradient(90deg,var(--green) 0 18px,#e6f3e8 18px 36px);border:2px solid var(--line);border-radius:8px}
.pvz-sunflower{position:absolute;bottom:3px;right:2px;transform:translateX(50%);z-index:3}
.pvz-sunflower .pvz-svg{width:44px;height:52px;display:block;animation:sfGlow 2.4s ease-in-out infinite}
.pvz-brain{position:absolute;bottom:8px;right:34px;z-index:2;opacity:.95}
.pvz-brain .pvz-svg{width:26px;height:26px;display:block;animation:sfGlow 2.4s ease-in-out infinite}
.pvz-plant{position:absolute;bottom:6px;transform:translateX(-50%);z-index:4;cursor:grab;touch-action:none;user-select:none}
.pvz-plant .pvz-svg{display:block;width:38px;height:46px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.pvz-plant.dragging{cursor:grabbing;z-index:9;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.pvz-plant.will-withdraw{outline:2px dashed #e3554b;outline-offset:2px;border-radius:6px}
.pvz-plant.eating .pvz-svg{animation:plShake .22s linear infinite!important}
.pvz-del{position:absolute;top:-10px;right:-10px;width:18px;height:18px;border-radius:50%;background:#e3554b;color:#fff;font-size:14px;line-height:18px;text-align:center;display:none;box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
.pvz-plant:hover .pvz-del,.pvz-plant.dragging .pvz-del{display:block}
.pvz-zombie{position:absolute;bottom:2px;transform:translateX(-50%);z-index:6;transition:left .25s linear;animation:zLurch .55s ease-in-out infinite}
.pvz-zombie .z-svg{width:42px;height:54px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pvz-zombie .z-arm{transform-origin:31px 26px;animation:zArm .55s ease-in-out infinite}
.pvz-zombie.z-eating{animation:zBite .35s ease-in-out infinite}
.pvz-zombie.z-slow .z-svg{filter:drop-shadow(0 0 5px #7bc8e6) sepia(0.3) hue-rotate(160deg)}
.pvz-zombie.z-injured .z-svg{filter:drop-shadow(0 0 4px #e3554b) sepia(0.4) hue-rotate(-40deg) saturate(1.3)}
.z-wrap{position:relative;display:inline-block;line-height:0}
.pvz-zombie .z-hpbar{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:42px;height:6px;margin-bottom:3px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.7);border-radius:4px;overflow:hidden;z-index:8;pointer-events:none}
.pvz-zombie .z-hpbar span{display:block;height:100%;width:var(--hp);background:var(--hp-color);transition:width .2s linear}
.pvz-ok{font-size:12px;color:var(--ok);margin:6px 0 2px}
.pvz-warn{font-size:12px;color:var(--warm);margin:6px 0 2px}
.pvz-bad{font-size:12px;color:var(--bad);margin:6px 0 2px;font-weight:700}
.pvz-shop{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pvz-shop-card{display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 8px;border:2px dashed var(--line);border-radius:10px;background:var(--card2);font-family:inherit;cursor:pointer;min-width:62px;opacity:.55}
.pvz-shop-card.on{opacity:1;border-color:var(--accent);background:var(--accent-weak)}
.pvz-ico .pvz-svg{width:30px;height:34px;display:block}
.pvz-plant .pvz-img{display:block;width:38px;height:46px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.pvz-plant.eating .pvz-img{animation:plShake .22s linear infinite!important}
.pvz-ico .pvz-img{display:block;width:30px;height:34px;object-fit:contain}
.pvz-zombie .z-img{width:42px;height:54px;display:block;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pvz-zombie.z-slow .z-img{filter:drop-shadow(0 0 5px #7bc8e6) sepia(0.3) hue-rotate(160deg)}
.pvz-zombie.z-injured .z-img{filter:drop-shadow(0 0 4px #e3554b) sepia(0.4) hue-rotate(-40deg) saturate(1.3)}
.pvz-zombie-opt .pvz-z-ico .z-img{width:36px;height:auto;display:block}
.pvz-nm{font-size:11px;color:var(--ink2)}.pvz-cost{font-size:11px;color:var(--warm);font-weight:700}
.pvz-hint{font-size:11px;color:var(--ink3);margin:4px 0 2px}
.pvz-zombie-list{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto}
.pvz-zombie-opt{display:flex;align-items:center;gap:10px;padding:8px;border:2px dashed var(--line);border-radius:10px;background:var(--card2);cursor:pointer;text-align:left;font-family:inherit}
.pvz-zombie-opt.on{border-color:var(--accent);background:var(--accent-weak)}
.pvz-zombie-opt .pvz-z-ico{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.pvz-zombie-opt .pvz-z-ico .pvz-svg{width:36px;height:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes brainShake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes zombieWalk{from{transform:translateX(40vw)}to{transform:translateX(0)}}
@keyframes plBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes plSpin{to{transform:rotate(360deg)}}
@keyframes plPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes plShake{0%{transform:translateX(-2px) rotate(-4deg)}50%{transform:translateX(2px) rotate(4deg)}100%{transform:translateX(-2px) rotate(-4deg)}}
@keyframes zLurch{0%{transform:translateX(-50%) translateY(0) rotate(-2deg)}50%{transform:translateX(-50%) translateY(-2px) rotate(2deg)}100%{transform:translateX(-50%) translateY(0) rotate(-2deg)}}
@keyframes zBite{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px) scale(1.05)}}
@keyframes zArm{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes sfGlow{0%,100%{filter:drop-shadow(0 0 2px #ffd23f)}50%{filter:drop-shadow(0 0 9px #ffd23f)}}
@keyframes peaFly{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(calc(-1 * var(--fly-dist, 200px)),-50%) scale(1)}}
@keyframes iceFly{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(calc(-1 * var(--fly-dist, 200px)),-50%) scale(1)}}
@keyframes mineBlink{0%,100%{fill:#e23b2e}50%{fill:#ff6b6b}}
@keyframes flamePulse{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes crackShow{0%{opacity:0}100%{opacity:1}}
.pvz-lawn{background-color:#7cbd3d;background-image:linear-gradient(45deg,#6ab22a 25%,transparent 25%,transparent 75%,#6ab22a 75%,#6ab22a),linear-gradient(45deg,#6ab22a 25%,#7cbd3d 25%,#7cbd3d 75%,#6ab22a 75%,#6ab22a);background-size:28px 28px;background-position:0 0,14px 14px;position:relative}
.pvz-lawn::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.12) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.12) 0 2px,transparent 3px),radial-gradient(circle at 40% 80%,rgba(255,255,255,.12) 0 2px,transparent 3px);pointer-events:none}
.pvz-pea,.pvz-ice{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;z-index:5;pointer-events:none}
.pvz-pea{background:radial-gradient(circle at 30% 30%,#b8f28b,#4caf50);border:1px solid #2e7d32;animation:peaFly .9s linear forwards}
.pvz-ice{background:radial-gradient(circle at 30% 30%,#e0f7ff,#7bc8e6);border:1px solid #3f88a8;box-shadow:0 0 4px #aee0f2;animation:iceFly .9s linear forwards}
.pvz-corn{background:radial-gradient(circle at 30% 30%,#fff3b0,#f4d03f);border:1px solid #caa024;animation:peaFly .9s linear forwards}
.pvz-melon{width:13px;height:13px;background:radial-gradient(circle at 30% 30%,#7bd47f,#3aa642);border:1px solid #2e7d32;animation:peaFly 1s linear forwards}
.pvz-plant .flame{position:absolute;bottom:0;left:50%;width:20px;height:26px;background:linear-gradient(to top,#ff9800,#ff5722,transparent);border-radius:50% 50% 40% 40%;transform:translateX(-50%) scale(0);opacity:0;transition:.15s}
.pvz-plant.eating[data-type="jalapeno"] .flame{transform:translateX(-50%) scale(1);opacity:.85;animation:flamePulse .4s infinite}
.pvz-plant.eating .wall-crack{opacity:1;animation:crackShow .2s ease}
.pvz-plant[data-type="potato"] .potato-mine circle{animation:mineBlink 1s infinite}
.pvz-collapsed .pvz-status,.pvz-collapsed .pvz-hint,.pvz-collapsed .pvz-shop{display:none}
.pvz-collapsed .pvz-track{margin-bottom:0}
.pvz-toggle{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);font-size:12px;line-height:20px;text-align:center;cursor:pointer;margin-left:6px}
#pvzBar{display:none}
.home-datecard{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hdc-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
.hdc-main{flex:1;min-width:0}
.hdc-name{font-weight:bold;font-size:17px;color:var(--ink)}
.hdc-date{font-size:13px;color:var(--muted);margin-top:2px}
.hdc-lv{background:var(--accent);color:#fff;font-size:13px;padding:4px 10px;border-radius:20px;font-weight:bold;flex:0 0 auto}
.home-statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.home-stat{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.home-stat b{display:block;font-size:20px;color:var(--accent-ink);font-weight:bold}
.home-stat span{font-size:11px;color:var(--muted)}
.home-activity{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.act-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;background:var(--card2);border-radius:10px}
.act-ico{font-size:15px;flex:0 0 auto}
.act-txt{flex:1;min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-date{font-size:11px;color:var(--muted);flex:0 0 auto}
.act-empty{font-size:13px;color:var(--muted);padding:8px;text-align:center}
/* ---- 图书馆书架 ---- */
.lib-hall{background:linear-gradient(160deg,#f6efe2,#efe6d4);border:2px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.lib-hall h3{font-weight:700;color:var(--accent-ink);letter-spacing:-.2px}
.shelf{display:flex;align-items:flex-end;gap:5px;background:linear-gradient(#caa978,#b8975f);padding:14px 10px 8px;border-radius:8px;margin:8px 0 4px;min-height:150px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-behavior:smooth;position:relative}
.shelf::-webkit-scrollbar{height:5px}
.shelf::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25);border-radius:3px}
.shelf-scroll-hint{text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.spine{flex:0 0 auto;width:24px;border-radius:3px 3px 0 0;cursor:pointer;transition:.15s;position:relative;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:upright;font-size:11px;color:#fff;padding:5px 0;min-height:90px;overflow:hidden;box-shadow:1px 0 0 rgba(0,0,0,.08)}
.spine:hover{transform:translateY(-5px);filter:brightness(1.07)}
.spine small{line-height:1.05;white-space:nowrap}
[data-theme="dark"] .lib-hall{background:linear-gradient(160deg,#2e2a24,#322c22)}
[data-theme="dark"] .shelf{background:linear-gradient(#5a4d3a,#4a3f2f)}
/* ---- 整馆片库：圆盘风琴旋转架 ---- */
.cd-carousel{position:relative;height:200px;perspective:1200px;display:flex;align-items:center;justify-content:center;margin:8px 0 4px;overflow:hidden}
.cd-disc-item{position:absolute;width:150px;height:150px;border-radius:50%;cursor:pointer;transition:transform .55s cubic-bezier(.2,.8,.25,1),opacity .45s,filter .45s;transform-style:preserve-3d;will-change:transform}
.cd-face{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 0deg,#cfe8ff,#fff,#ffd9ec,#fff,#d9ffe6,#fff,#cfe8ff);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),inset 0 0 0 30px rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.28)}
.cd-label{position:absolute;width:96px;height:96px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.cd-label img{width:100%;height:100%;object-fit:cover}
.cd-label .gen-cover{width:96px;height:96px}
.cd-hole{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--paper,#f6efe2);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);z-index:3}
.cd-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px}
.cd-now{font-weight:600;font-size:16px;color:var(--accent-ink);min-width:120px;text-align:center;letter-spacing:-.2px}
.cd-now .st{font-size:11px;font-family:-apple-system,sans-serif;color:var(--muted);margin-left:6px}
.cd-top{display:flex;flex-direction:column;align-items:center;gap:4px;margin:2px 0 2px}
.cd-now-top{font-weight:600;font-size:18px;color:var(--accent-ink);text-align:center;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;letter-spacing:-.2px}.cd-now-top .dot{font-size:12px;color:var(--muted);opacity:.7}.cd-now-top .st{font-size:11px;color:var(--accent);background:var(--accent-weak);padding:2px 8px;border-radius:999px;white-space:nowrap}
.cd-top .btn{margin-top:2px}
[data-theme="dark"] .cd-hole{background:#2e2a24}
/* ---- 放映厅内：圆形CD碟片网格 + 折叠 ---- */
.cd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;margin:8px 0 2px;justify-items:center}
.cd-disc.small{position:relative;width:92px;height:92px;cursor:pointer;transition:transform .15s}
.cd-disc.small .cd-face{box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),inset 0 0 0 20px rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.22)}
.cd-disc.small .cd-label{width:64px;height:64px}
.cd-disc.small .cd-label .gen-cover{width:64px;height:64px}
.cd-disc.small .cd-hole{width:14px;height:14px}
.cd-disc.small:hover{transform:translateY(-4px)}
.cd-disc.small .case-stamp{top:-6px;right:-6px}
.cd-disc.small .film-rating{left:50%;right:auto;transform:translateX(-50%);bottom:-5px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.cd-grid.collapsed .cd-extra{display:none}
.cd-expand-btn{display:block;margin:8px auto 2px;font-size:12px}
/* 整馆中央碟片：海报填充更大标签环，与厅内碟片视觉一致 */
.cd-disc-item.is-center .cd-label{width:120px;height:120px}
.cd-disc-item.is-center .cd-label .gen-cover{width:120px;height:120px}
.cd-disc-item.is-center .cd-hole{width:22px;height:22px}
[data-theme="dark"] .cd-disc.small .film-rating{background:#3a3c3e}
/* ---- 书房三状态书架 + 拖拽 ---- */
.shelf-block{margin:12px 0}
.shelf-label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:16px;color:var(--accent-ink);margin:6px 0 2px;letter-spacing:-.2px}
.shelf-label .cnt{font-size:11px;color:var(--muted);font-family:-apple-system,sans-serif}
.shelf.drag-over{outline:3px dashed var(--accent);outline-offset:2px;filter:brightness(1.07)}
.spine{touch-action:none;user-select:none}
.spine .grab{position:absolute;top:-3px;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:0 2px;opacity:0;transition:.12s;cursor:grab;z-index:3}
.spine:hover .grab{opacity:1}
.spine.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;width:34px;height:46px;border-radius:4px 4px 0 0;box-shadow:0 8px 18px rgba(0,0,0,.35);transform:translate(-50%,-60%) rotate(-6deg);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:upright;font-size:10px;color:#fff;padding:3px;overflow:hidden}
/* ---- 展开书本 ---- */
.book{position:relative;perspective:1200px;max-width:420px;margin:0 auto}
.book-cover{position:absolute;inset:0;background:linear-gradient(135deg,#8a5a3c,#5e3a22);border-radius:10px;color:#f6e7cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform-origin:left center;backface-visibility:hidden;animation:bookopen .7s ease forwards;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:2;padding:16px;text-align:center;pointer-events:none}
.book.opened .book-cover{display:none}
@keyframes bookopen{0%{transform:rotateY(0)}100%{transform:rotateY(-168deg)}}
.book-page{position:relative;min-height:300px;background:linear-gradient(#fffdf8,#fbf5e9);border:1px solid var(--line);border-left:6px solid #c9a36a;border-radius:8px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);transform-origin:left center}
.book-page.flip{animation:pageflip .45s ease}
@keyframes pageflip{0%{transform:rotateY(38deg);opacity:.35}100%{transform:rotateY(0);opacity:1}}
.book-page h4{font-weight:700;color:var(--accent-ink);margin:0 0 8px;font-size:18px;letter-spacing:-.2px}
.book-page .bk-meta{font-size:12px;color:var(--muted);margin:4px 0 10px}
.book-page .field{margin:8px 0;font-size:13px}
.book-page .field>b{color:var(--accent-ink)}
.book-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.book-nav button{flex:1}
.book-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.book-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.book-dots i.on{background:var(--accent)}
[data-theme="dark"] .book-page{background:linear-gradient(#2b2a26,#26241f);border-color:#3a352c}
/* ---------- 放映厅影片笔记本翻页 ---------- */
.film-notebook{position:relative;perspective:1400px;margin:4px 0 2px}
.film-page{position:relative;min-height:330px;max-height:62vh;overflow:auto;background:linear-gradient(#fffdf6,#f7f0e0);border:1px solid var(--line);border-left:7px solid #b98a4e;border-radius:8px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.16);transform-origin:left center}
.film-page.flip{animation:pageflip .45s ease}
.film-page h4{font-weight:700;color:var(--accent-ink);margin:0 0 8px;font-size:17px;letter-spacing:-.2px}
.film-page .field{margin:7px 0;font-size:13px;line-height:1.55}
.film-page .field>b{color:var(--accent-ink)}
.film-page .quotes-ta{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;padding:8px;background:#fffdf8;resize:vertical;box-sizing:border-box}
[data-theme="dark"] .film-page{background:linear-gradient(#2b2a26,#26241f);border-color:#3a352c;border-left-color:#7a5a32}
[data-theme="dark"] .book-cover{background:linear-gradient(135deg,#5e3a22,#3a2415)}
.film-win-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-top:8px}
.film-case{position:relative;aspect-ratio:3/4;min-height:170px;background:var(--card2);border:1px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden;padding:8px;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(60,50,40,.12);transition:transform .22s ease,box-shadow .22s ease}
.film-case::before,.film-case::after{content:"";position:absolute;background:var(--card2);border:1px solid var(--line);border-radius:8px;z-index:-1}
.film-case::before{inset:7px -8px -10px 8px;transform:rotate(4deg)}
.film-case::after{inset:12px -15px -17px 12px;transform:rotate(-3deg);background:var(--card)}
.film-case:hover{transform:translateY(-4px) rotate(-1.2deg);box-shadow:0 12px 24px rgba(60,50,40,.22)}
.film-case.lit{box-shadow:0 0 0 2px var(--ok),0 6px 16px rgba(120,200,140,.35)}

 } else {

 (DEFAULT_FILMS||[]).forEach(d=>{

   if(ex){

   } else {

   }
 });
 s.film.forEach(f=>{ if(f.cat==="演说访谈") f.cat="访谈演讲"; });
 if(!s.ver || s.ver<DATA_VER){

  const watched=["海蒂和爷爷","决胜时刻","开国将帅授衔1955","萨利机长","建党伟业","大空头","喜剧之王","给阿嫲的情书"];

// ---------- 云端同步（JSONBin.io v3，跨设备同一份数据） ----------
function cloudCfg(){const k=localStorage.getItem(CLOUD_KEY)||"";const b=localStorage.getItem(CLOUD_BIN)||"";return{k:k,b:b,on:(k&&b)};}
function setCloudStatus(txt,cls){const el=document.getElementById("cloudStatus");if(el){el.textContent=txt;el.className="cloud-status "+(cls||"");}}
async function cloudLoad(){
 const c=cloudCfg();if(!c.on)throw new Error("未配置云端");
 const r=await fetch(API_ROOT+"/"+c.b+"/latest",{headers:{"X-Master-Key":c.k}});
 if(!r.ok)throw new Error("拉取失败 "+r.status);
 const j=await r.json();return j.record;           // 实际数据嵌套在 record 下
}
let _cloudBusy=false,_cloudPending=false;
async function cloudSave(){
 const c=cloudCfg();if(!c.on)return;                // 未配置则不联网
 if(_cloudBusy){_cloudPending=true;return;}         // 合并并发上传
 _cloudBusy=true;
 try{
  setCloudStatus("同步中…","syncing");
  const r=await fetch(API_ROOT+"/"+c.b,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":c.k},body:JSON.stringify(S)});
  if(!r.ok)throw new Error("上传失败 "+r.status);
  setCloudStatus("已同步 ☁","ok");
 }catch(e){setCloudStatus("同步失败 · 已本地保存","err");}
 _cloudBusy=false;
 if(_cloudPending){_cloudPending=false;cloudSave();}
}
async function cloudPull(silent){
 try{
  setCloudStatus("拉取云端…","syncing");
  const remote=await cloudLoad();
  const local=S.__updatedAt||0, remoteT=remote&&remote.__updatedAt||0;
  if(remote && remoteT>local){
   // 保护：若远端是默认头像/名（说明云端被旧默认数据占据），但本地有真实设置，则保留本地真实设置
   if(remote.settings){
    if((!remote.settings.avatar||remote.settings.avatar===DEFAULT_AV)&&S.settings&&S.settings.avatar&&S.settings.avatar!==DEFAULT_AV) remote.settings.avatar=S.settings.avatar;
    if((!remote.settings.name||remote.settings.name===DEFAULT_NAME)&&S.settings&&S.settings.name&&S.settings.name!==DEFAULT_NAME) remote.settings.name=S.settings.name;
   }
   // ⚠ 负债数据一致性保护：拉取前记录本地负债值，拉取后比对
   const localT=totals();
   const localLiab=localT.liab;
   S=remote;migrate(S);
   const remoteT2=totals();
   // 若云端负债与本地差异超过 50%，弹窗让用户选择是否接受
   if(Math.abs(remoteT2.liab-localLiab)>Math.max(localLiab,1000)*0.5){
    const msg=`云端负债 ¥${fmtMoney(remoteT2.liab)} 与本机 ¥${fmtMoney(localLiab)} 差异较大。\n\n点击「确定」接受云端数据（可能覆盖本机 newer 数据）；\n点击「取消」保留本机数据并上传覆盖云端。`;
    if(confirm(msg)){
     localStorage.setItem(KEY,JSON.stringify(S));render();setCloudStatus("已从云端更新 ☁","ok");if(!silent)toast("已从云端更新");
    } else {
     // 用户选择保留本地：不替换 S，把本地数据推上云端覆盖
     S.__updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));
     setCloudStatus("保留本机 · 正在上传覆盖云端…","syncing");
     cloudSave();render();
     if(!silent)toast("已保留本机数据，正在覆盖云端");
    }
   } else {
    localStorage.setItem(KEY,JSON.stringify(S));render();setCloudStatus("已从云端更新 ☁","ok");if(!silent)toast("已从云端更新");
   }
  }
  else{setCloudStatus("本地即最新 ☁","ok");if(!silent)toast("本地即是最新");}
 }catch(e){setCloudStatus("云端不可用 · 本地模式","err");if(!silent)toast("拉取失败："+e.message);}
}
async function initCloudSync(){
 const c=cloudCfg();

 try{ await cloudPull(true); } finally { cloudSyncReady=true; }
}

function handleBgUpload(file){
 if(!file)return;
 if(file.size>5*1024*1024){toast("图片太大，请选 5MB 以下");return;}
 const reader=new FileReader();
 reader.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const canvas=document.createElement("canvas");
   const maxW=1200;const w=img.width,h=img.height;
   const scale=Math.min(1,maxW/w);
   canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
   const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL("image/jpeg",0.7);
   if(!S.settings)S.settings={};S.settings.bgImage=data;
   const fn=document.getElementById("bgFileName");if(fn)fn.textContent="已上传自定义照片";
   save();applyBg();toast("背景图片已上传");
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}

 (S.knowledge||[]).forEach((k,i)=>{if(k.topic)idx.push({type:"知识",title:k.topic,subtitle:k.cat||"",view:"knowledge",idx:i});});
 (S.diary||[]).forEach(e=>{const dt=DIARY_SECTIONS.map(s=>(e.sections&&e.sections[s.k]||"")).filter(Boolean).join(" / ");if(e.date||dt)idx.push({type:"写作 · 日记",title:e.date+(e.mood?(" "+e.mood):""),subtitle:dt.slice(0,40),view:"writing"});});
 (S.ledger||[]).forEach((x,i)=>{if(x.note||x.cat||x.amount)idx.push({type:"记账",title:(x.type==="transfer"?"转账":x.type==="in"?"收入":"支出")+" ¥"+x.amount+" · "+(x.cat||"其他")+((x.method&&x.method!=="其他")?" · "+x.method:"")+(accountName(x.accountId)?" · "+accountName(x.accountId):""),subtitle:((x.method&&x.method!=="其他")?x.method+" · ":"")+(accountName(x.accountId)||"")+(x.note?" · "+x.note:""),view:"money"});});

function handleStagePhoto(e,stage){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{const id=Date.now()+Math.random();R().photos.push({id,stage,date:todayStr(),src:r.result,note:"",aiCheck:null});save();render();toast("照片已保存");};
 r.readAsDataURL(f);
}
function handleCheckPhoto(e,stage,idx){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const id=Date.now()+Math.random();
  const st=R().stages.find(s=>s.name===stage);
  if(!st.checks[idx].photos) st.checks[idx].photos=[];
  st.checks[idx].photos.push(id);
  R().photos.push({id,stage,date:todayStr(),src:r.result,note:"",aiCheck:null,checkIdx:idx});
  save();render();toast("照片已挂接到清单项");
 };
 r.readAsDataURL(f);
}
function handleDefectPhoto(e,defectId){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const id=Date.now()+Math.random();
  const d=R().defectLog.find(x=>x.id===defectId);
  if(d){if(!d.photos) d.photos=[];d.photos.push(id);}
  const st=R().currentStage;
  R().photos.push({id,stage:st,date:todayStr(),src:r.result,note:"",aiCheck:null,defectId});
  save();render();toast("照片已挂接到缺陷");
 };
 r.readAsDataURL(f);
}
function deleteStagePhoto(idx,stage){
 const arr=R().photos.filter(p=>p.stage===stage);const target=arr[idx];
 const i=R().photos.indexOf(target);
 if(i>=0){
  const pid=R().photos[i].id;
  // 同步清理 checklist / defect 中的引用
  R().stages.forEach(s=>{if(s.name===stage){s.checks.forEach(c=>{if(c.photos)c.photos=c.photos.filter(p=>p!==pid);});}});
  R().defectLog.filter(d=>d.stage===stage).forEach(d=>{if(d.photos)d.photos=d.photos.filter(p=>p!==pid);});
  R().photos.splice(i,1);save();render();
 }
}
function toggleCheck(stageName,i,e){
 const st=R().stages.find(s=>s.name===stageName);const c=st.checks[i];const was=c.d;
 c.d=!c.d;
 if(!was){S.checkinXp+=5;confetti();floatXp("+5 XP",e);}
 else{S.checkinXp=Math.max(0,S.checkinXp-5);}
 st.done=st.checks.every(x=>x.d);

function yogaComplete(period){const y=S.fitness.yoga,T=todayStr();
 const alreadyToday=(period==='morning')?y.eveningDate===T:y.morningDate===T;
 if(period==='morning'){if(y.morningDate===T){toast('今日晨练已完成 ✅');return;}y.morningDate=T;y.morningRounds=12;}

 y.log=(y.log||[]);y.log.push({date:T,period:period,rounds:12});y.log=y.log.slice(-60);
 if(!alreadyToday){y.streak=(y.lastDoneDate===yesterdayStr())?(y.streak||0)+1:1;y.lastDoneDate=T;}
 S.checkinXp+=10;save();confetti();
 toast((period==='morning'?'🌅 晨练':'🌙 晚练')+' 拜日式A 12 组完成 +10 XP 🧘');render();

  while(cur<=limit && cur<=end){
   const d=iso(cur);
   const exists=(S.ledger||[]).some(r=>r.recurringId===rule.id&&r.date===d);
   if(!exists){
    S.ledger.push({id:Date.now()+Math.floor(Math.random()*1000000),date:d,type:rule.type,cat:rule.cat||"其他",amount:+rule.amount||0,accountId:rule.accountId||"acc_cash",method:rule.method||"其他",merchant:rule.merchant||"",note:rule.note||"",src:"固定收支",createdAt:Date.now(),recurringId:rule.id});

}

function moneyHealthHTML(){

 const monthKey=d=>{const nd=normDate(d);if(nd&&nd.length===10)return nd.slice(0,7);const s=String(d||'');if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6);return (nd||s).slice(0,7);};
 const byMonth={};
 const add=(m,key,amt)=>{if(!byMonth[m])byMonth[m]={out:0,in:0,repay:0};byMonth[m][key]+=amt;};
 creditRecs.forEach(r=>{
  const m=monthKey(r.date);
  if(r.type==="out")add(m,"out",+r.amount||0);
  if(r.type==="in")add(m,"in",+r.amount||0);
  if(r.type==="transfer"&&r.toAccountId==="acc_liability")add(m,"repay",+r.amount||0);
 });
 L.filter(r=>r.type==="out"&&/招商银行信用卡.*扣款|信用卡还款/.test((r.method||"")+(r.merchant||"")+(r.note||""))).forEach(r=>{add(monthKey(r.date),"repay",+r.amount||0);});
 let acc=0;
 const months=Object.keys(byMonth).sort();
 const rows=months.map(m=>{const b=byMonth[m];acc+=b.out-b.in-b.repay;return `<tr style="border-bottom:1px dashed var(--line)"><td style="padding:6px 4px">${m}</td><td style="padding:6px 4px;color:#f56c6c;text-align:right">-${fmtMoney(b.out)}</td><td style="padding:6px 4px;color:#67c23a;text-align:right">+${fmtMoney(b.in)}</td><td style="padding:6px 4px;color:#409eff;text-align:right">-${fmtMoney(b.repay)}</td><td style="padding:6px 4px;font-weight:700;text-align:right">${fmtMoney(acc)}</td></tr>`;}).join("");
 const T=totals();
 const liquid=(S.accounts||[]).filter(a=>["cash","wechat","alipay","bank"].includes(a.type)).reduce((s,a)=>s+accountBalance(a),0);
 const debtRatio=T.assets?T.liab/T.assets*100:0;
 const ccOut=creditRecs.filter(r=>r.type==="out").reduce((s,r)=>s+(+r.amount||0),0);
 const ccIn=creditRecs.filter(r=>r.type==="in").reduce((s,r)=>s+(+r.amount||0),0);
 const ccRepay=creditRecs.filter(r=>r.type==="transfer"&&r.toAccountId==="acc_liability").reduce((s,r)=>s+(+r.amount||0),0);
 const monthlyFixed=17700+3000+40000/6;
 const tips=[];
 if(T.liab>monthlyFixed*2) tips.push(`信用卡负债 <b style="color:#f56c6c">¥${fmtMoney(T.liab)}</b> 超过 2 个月固定收入，优先还清。`);
 if(liquid<T.liab) tips.push(`流动资产 <b>¥${fmtMoney(liquid)}</b> 不足以覆盖负债，需加快还款或补充现金。`);
 if(debtRatio>5) tips.push(`负债/资产 ${debtRatio.toFixed(1)}%（资产以房产为主），现金负债压力需关注。`);

  const blob=((r.cat||"")+" "+(r.merchant||"")+" "+(r.note||"")).toLowerCase();
  if(!kws.some(k=>blob.includes(k.toLowerCase())))return;
  if(opts.exclude&&opts.exclude.some(k=>blob.includes(k.toLowerCase())))return;
  const ym=(r.date||"").slice(0,7);
  if(ym in buckets)buckets[ym]+=Math.abs(+r.amount||0);
 });
 const active=Object.values(buckets).filter(v=>v>0).length;
 const total=Object.values(buckets).reduce((s,v)=>s+v,0);
 const denom=active||months;
 return Math.round(total/denom*100)/100;
}

function planCompute(){
 const ip=S.incomePlan||defaultIncomePlan();
 const salary=ip.salaryAuto?detectSalary():(+ip.salary||0);
 const rent=+ip.rentIncome||0;
 const income=salary+rent;
 const fixed=ip.fixed||[];
 const fixedTotal=fixed.reduce((s,f)=>s+(+f.amount||0),0);
 const afterFixed=income-fixedTotal;
 const goal=+ip.savingsGoal||0;
 const savings=afterFixed>0?Math.min(goal,afterFixed):0;
 const discretionary=afterFixed-savings;
 return {ip,salary,rent,income,fixed,fixedTotal,afterFixed,goal,savings,discretionary,deficit:afterFixed<0,savingsMet:(afterFixed>=goal)&&goal>0};
}

function wageCompute(ov){
 const w=Object.assign({},S.wage||defaultWage(),ov||{});
 const annual=w.takeHome*(w.payMonths||12);              // 年到手 = 到手月薪 × 发薪月数
 const monthly=annual/12;                              // 月均到手 = 年到手 ÷ 12
 const seatHours=Math.max(0.1,(+w.onSite||0));           // 每天在场
 const commuteH=Math.max(0,(+w.commute||0));             // 每天通勤
 const otH=Math.max(0,(+w.overtime||0));                 // 每月加班
 const days=Math.max(1,(+w.workdays||1));                // 每月工作日
 const nominal=seatHours>0?monthly/(days*seatHours):0;   // ① 名义时薪（只看坐班）
 const totalHours=days*(seatHours+commuteH)+otH;         // ② 每月总投入工时（含通勤加班）
 const nominalAll=totalHours>0?monthly/totalHours:0;     // ③ 含通勤加班的名义时薪
 const netAfterCost=monthly-Math.max(0,(+w.workCost||0));// ④ 扣工作成本后的净劳动报酬
 const realHourly=totalHours>0?netAfterCost/totalHours:0;// ⑤ 真实时薪（成本版）
 const nec=Math.max(0,(+w.necessary||0));
 const realHourlyN=totalHours>0?(netAfterCost-nec)/totalHours:0; // ⑥ 真实时薪（必要开支版）
 const freeHoursMonth=Math.max(0,720-totalHours);        // 每月自由时间（小时）
 return {w,monthly,annual,seatHours,commuteH,otH,days,nominal,totalHours,nominalAll,netAfterCost,realHourly,nec,realHourlyN,freeHoursMonth};
}
function sceneCompute(){
 if(!moneyScene)moneyScene={commute:(S.wage||defaultWage()).commute,overtime:(S.wage||defaultWage()).overtime,raisePct:0};
 const w=S.wage||defaultWage();
 const ov={commute:moneyScene.commute,overtime:moneyScene.overtime,takeHome:w.takeHome*(1+moneyScene.raisePct/100)};
 const c=wageCompute(ov);
 const base=wageCompute();
 return {scene:moneyScene,c,base};
}

// ---------- 智能导入账单 CSV（银行 / 微信 / 支付宝对账单导出，由 openImport 统一入口自动识别）----------
function stmtNormDate(s){if(!s)return "";let t=String(s).trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?\s*$/,"").replace(/[/.]/g,"-");const p=t.split("-");if(p.length===3)return normDate(p[0]+"-"+p[1]+"-"+p[2]);if(p.length===2)return normDate(new Date().getFullYear()+"-"+p[0]+"-"+p[1]);return normDate(s);}
function stmtNum(v){if(v==null)return 0;let s=String(v).trim().replace(/[¥￥$,\s]/g,"").replace(/\(([^)]+)\)/,"-$1");if(s==="")return 0;const n=parseFloat(s);return isNaN(n)?0:n;}
const STMT_CAT=[["工资",/工资|薪资|薪酬|代发|薪金|发薪/],["餐饮",/餐饮|饭|餐|美食|外卖|麦当劳|肯德基|肯德鸡|星巴克|咖啡|餐厅|食堂|小吃|奶茶|酒/],["交通",/交通|地铁|公交|滴滴|打车|出租车|高铁|火车|12306|加油|油费|停车|ETC|机票|网约车/],["购物",/淘宝|京东|拼多多|天猫|超市|便利店|商城|唯品会|购物|网购|专卖店|百货/],["医疗",/医疗|医院|药店|诊所|卫生|保健|体检/],["话费",/话费|充值|通讯|电信|移动|联通|缴费/],["居家",/水电|物业|电费|水费|燃气|暖气|宽带|房租|物业费|家政|维修|装修/],["订阅",/订阅|会员|视频|音乐|网飞|爱奇艺|优酷|腾讯视频|网易云|喜马拉雅|知乎|App Store|苹果|自动续费/],["教育",/教育|学费|培训|图书|课程|网课/],["旅游",/旅游|酒店|住宿|景区|门票|携程|飞猪/],["娱乐",/电影|游戏|steam|娱乐|演出|演唱会/],["理财",/理财|基金|股票|证券|收益|利息|活期|定期|黄金|国债/],["红包",/红包|微信红包|零钱|转帐|转账/]];
function stmtGuessCat(merchant){const m=String(merchant||"");for(const [c,re] of STMT_CAT){if(re.test(m))return c;}return "其他";}
function stmtParse(text){
 const lines=String(text).split(/\r?\n/).filter(l=>l.trim()!=="");
 if(!lines.length)return {rows:[]};
 const first=lines[0];
 const delims=[",","\t",";","|"];let best=",",bestN=0;
 delims.forEach(d=>{const n=first.split(d).length;if(n>bestN){bestN=n;best=d;}});
 const hdr=lines[0].split(best).map(h=>h.trim().toLowerCase().replace(/\s+/g,""));
 const idx={};
 const map=(keys,role)=>{for(let i=0;i<hdr.length;i++){for(const k of keys){if(hdr[i].indexOf(k)>=0){idx[role]=i;return;}}}};
 map(["date","时间","日期","记账日期","交易日期","交易日"],"date");
 map(["income","收入","贷方","进账","存入"],"income");
 map(["out","支出","借方","出账","支取","付出"],"out");
 map(["balance","余额","账户余额","当前余额"],"balance");
 map(["merchant","counterparty","对手","对方","商户","商品","交易对手","收款人","付款人","名称"],"merchant");
 map(["note","remark","摘要","备注","说明","memo","用途","交易说明"],"note");
 map(["type","收支类型","交易类型","方向","类别"],"type");
 // 金额类候选列（排除余额）；扫描出真正带符号（正负都有）的金额列
 const amtCols=[];
 for(let i=0;i<hdr.length;i++){ if(i===idx.balance)continue; if(/金额|发生额|amount|交易额/.test(hdr[i])) amtCols.push(i); }
 let signedCol=-1;
 for(const ci of amtCols){
  let hasPos=false,hasNeg=false;
  for(let i=1;i<lines.length;i++){ const v=stmtNum((lines[i].split(best)[ci]||"").trim()); if(v>0)hasPos=true; if(v<0)hasNeg=true; if(hasPos&&hasNeg)break; }
  if(hasPos&&hasNeg){signedCol=ci;break;}
 }
 const rows=[];
 const hasIO=(idx.income!=null)||(idx.out!=null);
 for(let i=1;i<lines.length;i++){
  const cells=lines[i].split(best);
  if(cells.length<Math.max(1,(idx.date||0))+1)continue;
  let date="",amount=0,type="out",merchant="",note="";
  if(idx.date!=null)date=stmtNormDate(cells[idx.date]);
  if(hasIO){
   const inc=idx.income!=null?stmtNum((cells[idx.income]||"").trim()):0;
   const out=idx.out!=null?stmtNum((cells[idx.out]||"").trim()):0;
   if(inc>0){amount=inc;type="in";} else if(out>0){amount=out;type="out";} else continue;
  } else if(signedCol>=0){
   const a=stmtNum((cells[signedCol]||"").trim());
   if(a===0)continue; amount=Math.abs(a); type=a<0?"out":"in";
  } else if(amtCols.length){
   const a=stmtNum((cells[amtCols[0]]||"").trim());
   if(a===0)continue; amount=a; type="out";
  } else continue;
  if(idx.type!=null){const t=String(cells[idx.type]||"");if(/转(账|帐)|transfer|内部|行间/.test(t))type="transfer";else if(/收入|收|贷|进/.test(t)&&!/支/.test(t))type="in";else if(/支出|付|借|出/.test(t))type="out";}
  if(idx.merchant!=null)merchant=String(cells[idx.merchant]||"").trim();
  if(idx.note!=null)note=String(cells[idx.note]||"").trim();
  if(!date)date=normDate(todayStr());
  rows.push({date,amount,type,merchant,note});
 }
 return {rows};
}
function previewStatementCSV(text,fname){

 if(!S.ledger)S.ledger=[];
 const accts=S.accounts||defaultAccounts()||[];
 const defAcc=accts.find(a=>a.id==="acc_bank")?("acc_bank"):((accts[0]||{}).id||"acc_bank");
 const accOpts=accts.map(a=>`<option value="${a.id}" ${a.id===defAcc?"selected":""}>${esc(a.name)}</option>`).join("");
 const exist=new Set(S.ledger.map(r=>(r.date||"")+"|"+Math.round((+r.amount||0)*100)+"|"+esc(r.merchant||"")));
 let toAdd=0;
 const sample=rows.slice(0,40).map(r=>{const key=r.date+"|"+Math.round(r.amount*100)+"|"+esc(r.merchant||"");const dup=exist.has(key);if(!dup)toAdd++;return `<div style="display:flex;gap:8px;font-size:12px;padding:3px 2px;border-bottom:1px dashed var(--line);${dup?"opacity:.45":""}"><span style="width:92px;flex:0 0 auto;color:var(--muted)">${r.date}</span><span style="width:52px;flex:0 0 auto;color:${r.type==="in"?"var(--up)":r.type==="transfer"?"var(--accent)":"var(--down)"}">${r.type==="in"?"+":r.type==="transfer"?"⇄":"-"}${r.amount}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.merchant||"(无商户)")}</span>${dup?'<span style="color:var(--muted);font-size:11px">重复</span>':""}</div>`;}).join("");
 const html=`<h3>📥 智能导入账单 · ${esc(fname)}</h3>
  <div style="font-size:12px;color:var(--muted);margin:4px 0 8px">共识别 <b>${rows.length}</b> 笔，去重后新增 <b style="color:var(--ok)">${toAdd}</b> 笔（已存在 ${rows.length-toAdd} 笔跳过）</div>
  <div style="display:flex;gap:10px;margin:6px 0 10px;flex-wrap:wrap;align-items:center">
   <label style="font-size:12px;color:var(--ink2)">入账账户：<select id="csvAcc" style="padding:5px 8px;border:2px dashed var(--line);border-radius:8px">${accOpts}</select></label>
   <span style="font-size:11px;color:var(--muted)">自动分类按商户关键词；含「还款/信用卡」自动冲减负债</span>
  </div>
  <div style="max-height:46vh;overflow:auto;margin:4px 0 10px">${sample}${rows.length>40?`<div style="font-size:11px;color:var(--muted);padding:6px 2px">…还有 ${rows.length-40} 笔</div>`:""}</div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sm ghost" onclick="closeSheet()">取消</button><button class="btn sm primary" onclick="doStatementImport()">确认导入 ${toAdd} 笔</button></div>`;
 showSheet(html);
 window.__csvRows=rows;
}
function doStatementImport(){
 const rows=window.__csvRows||[];if(!rows.length){closeSheet();return;}
 const acc=document.getElementById("csvAcc");const accountId=acc?acc.value:"acc_bank";
 if(!S.ledger)S.ledger=[];
 const exist=new Set(S.ledger.map(r=>(r.date||"")+"|"+Math.round((+r.amount||0)*100)+"|"+esc(r.merchant||"")));

  const rec={id:"csv_"+Date.now()+"_"+add+"_"+Math.floor(Math.random()*1000),date:r.date,type:type==="transfer"?"transfer":(type==="in"?"in":"out"),cat:cat,amount:r.amount,accountId:accountId,method:"账单导入",merchant:r.merchant||"",note:r.note||"",src:"账单CSV",createdAt:Date.now(),img:""};

function setEstateValue(id){const el=document.getElementById("mv_"+id);const v=el?parseFloat(el.value)||0:0;const a=accountById(id);if(!a||a.type!=="estate")return;a.marketValue=v;save();toast("房产市值已更新");}
function extractFundCode(note){if(!note)return null;const m=note.match(/(\d{6})/);return m?m[1]:null;}
function updateFundAccountByCode(acc,price){if(!acc||acc.type!=="fund")return;acc.opening=price;save();}
function fetchFundPrice(code,cb){if(!code)return cb(null);const cbName="jsonpgz";const sc=document.createElement("script");sc.src="https://fundgz.1234567.com.cn/js/"+code+".js?rt="+Date.now();window[cbName]=(json)=>{try{delete window[cbName];if(sc.parentNode)sc.parentNode.removeChild(sc);cb(json&&json.gsz?parseFloat(json.gsz):null);}catch(e){cb(null);}};sc.onerror=()=>{try{delete window[cbName];if(sc.parentNode)sc.parentNode.removeChild(sc);}catch(e){}cb(null);};document.head.appendChild(sc);}
function updateFloatingAssets(now){
 now=now||new Date();let updated=0,logs=[];
 (S.accounts||[]).forEach(a=>{
  if(accountClass(a)!=="floating")return;
  if(a.type==="fund"){const code=extractFundCode(a.note);if(code){fetchFundPrice(code,(p)=>{if(p){updateFundAccountByCode(a,p);logs.push(a.name+" ¥"+fmtMoney(p));updated++;}});}}
 });
 S.lastFloatingUpdate=iso(now);
 save();
 if(updated)toast("已更新 "+updated+" 个基金净值");
 return {updated,logs};
}
function scheduleFloatingUpdate(){
 if(!S.floatingAutoUpdate){S.floatingAutoUpdate=true;save();}
 const now=new Date();const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),15,30,0);
 if(target<=now)target.setDate(target.getDate()+1);
 const ms=target.getTime()-now.getTime();
 setTimeout(()=>{
  const today=iso(new Date());
  if(S.lastFloatingUpdate!==today){updateFloatingAssets();}
  scheduleFloatingUpdate();
 },ms);
}
// 股票行情每日自动更新（与基金净值刷新对称）：每天 15:30 收市后自动同步一次，
// 仅在当天尚未同步时触发；标签页保持打开即可每日自动刷新。
function scheduleStockSync(){
 if(!S.stockAutoUpdate){S.stockAutoUpdate=true;save();}
 const now=new Date();const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),15,30,0);
 if(target<=now)target.setDate(target.getDate()+1);
 const ms=target.getTime()-now.getTime();
 setTimeout(function(){
  const today=iso(new Date());
  if(S.lastStockSync!==today){stockLiveSync();S.lastStockSync=today;save();}
  scheduleStockSync();
 },ms);
}
function syncProvidentFromLedger(){
 const now=new Date();const y=now.getFullYear(),m=now.getMonth();
 const start=iso(new Date(y,m,1)),end=monthEnd(y,m);
 let inAmt=0,outAmt=0;(S.ledger||[]).forEach(r=>{if(r.date<start||r.date>end)return;if(r.accountId==="acc_provident"){if(r.type==="in")inAmt+=+r.amount||0;if(r.type==="out")outAmt+=+r.amount||0;}});
 const a=accountById("acc_provident");if(!a)return;
 const net=inAmt-outAmt;if(net!==0){a.opening=(a.opening||0)+net;save();toast("公积金已按本月流水更新：+"+fmtMoney(inAmt)+" / -"+fmtMoney(outAmt));}
 else toast("本月暂无公积金流水，未调整");
}

// ---------- 日记（马伯庸流水账法） ----------
// 核心原则：一事一条，只记事实，不抒情、不评论、不自我批判。栏目弹性，碎片时间随手填。
const DIARY_SECTIONS=[
 {k:"sleep",t:"😴 睡眠",ph:"几点睡 / 几点起"},
 {k:"food",t:"🍜 饮食",ph:"今天吃了什么"},
 {k:"work",t:"💻 工作/写作",ph:"写了多少字、做了啥"},
 {k:"reading",t:"📚 阅读/书账",ph:"看了什么书、学到啥"},
 {k:"learn",t:"💡 今日新知",ph:"新知识点、冷知识"},
 {k:"idea",t:"✨ 灵感",ph:"突然冒出的想法"},
 {k:"dream",t:"🌙 梦境",ph:"记得的梦"},
 {k:"sport",t:"🏃 运动",ph:"运动 / 体态打卡"},
 {k:"mood",t:"🌈 心情",ph:"今天的心情"},
 {k:"state",t:"🔋 状态",ph:"精力 / 状态"},
 {k:"other",t:"💬 碎碎念",ph:"随口一句都行"}
];
let diaryOpen={};   // id -> 是否展开（>7 天折叠项点开用）
let writingTab="works"; // writing 板块内子页签：works / diary
function diaryDaysAgo(d){const a=new Date(d+"T00:00:00"),b=new Date(normDate(todayStr())+"T00:00:00");if(isNaN(a.getTime())||isNaN(b.getTime()))return 999;return Math.round((b-a)/86400000);}
function diaryWeekday(d){const w=["周日","周一","周二","周三","周四","周五","周六"];const x=new Date(d+"T00:00:00");if(isNaN(x.getTime()))return"";return w[x.getDay()];}
function diarySummary(e){for(const s of DIARY_SECTIONS){const v=(e.sections&&e.sections[s.k]||"").trim();if(v)return v;}return "（无文字记录）";}
function renderDiary(main){
 if(!S.diary)S.diary=[];
 const list=S.diary.slice().sort((a,b)=>(b.date||"").localeCompare(a.date)||b.id-a.id);
 const today=normDate(todayStr());
 const hasToday=list.some(e=>e.date===today);
 const c=document.createElement("div");c.className="card";
 c.innerHTML=`<h2>📓 日记 · 马伯庸流水账</h2>
  <div style="font-size:12px;color:var(--muted);margin-bottom:8px">只记事实，不抒情不评论，一事一条。最近 7 天显示全文，更早的折叠，点开看全文。</div>
  <button class="btn sm primary" onclick="openDiaryForm()">${hasToday?"✏️ 补写 / 修改今日":"➕ 写今天"}</button>
  ${hasToday?"":`<button class="btn sm" style="margin-left:6px" onclick="openDiaryForm()">📅 写指定日期</button>`}`;
 main.appendChild(c);
 if(!list.length){const e=document.createElement("div");e.className="card";e.innerHTML=`<div style="color:var(--muted);font-size:13px;text-align:center;padding:14px">还没有日记。点上面按钮，写下今天的第一条流水账吧。</div>`;main.appendChild(e);return;}
 list.forEach(e=>{
  const ago=diaryDaysAgo(e.date);
  const recent=ago<=7&&ago>=0;
  const open=recent||!!diaryOpen[e.id];
  const mood=(e.mood||"").trim();
  const weather=(e.weather||"").trim();
  const meta=`<span style="font-size:12px;color:var(--muted)">${esc(diaryWeekday(e.date)||"")}</span>${weather?` · <span style="font-size:12px;color:var(--muted)">${esc(weather)}</span>`:""}${ago===0?' · <span style="font-size:12px;color:var(--accent-ink)">今天</span>':(ago>0?` · <span style="font-size:12px;color:var(--muted)">${ago}天前</span>`:"")}`;
  const head=document.createElement("div");head.className="card";
  if(open){
   let body=`<div style="margin-top:8px">`;
   let any=false;
   DIARY_SECTIONS.forEach(s=>{const v=(e.sections&&e.sections[s.k]||"").trim();if(v){any=true;body+=`<div style="margin:6px 0"><div style="font-size:12px;color:var(--accent-ink)">${s.t}</div><div style="font-size:14px;color:var(--ink);white-space:pre-wrap;line-height:1.5">${esc(v)}</div></div>`;}});
   if(!any)body+=`<div style="font-size:13px;color:var(--muted)">（这条没有文字内容）</div>`;
   body+=`</div>`;
   head.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer" onclick="toggleDiary(${e.id})">
     <div style="min-width:0"><b style="font-size:16px;color:var(--accent-ink)">${mood?esc(mood)+" ":""}${esc(e.date)}</b><br>${meta}</div>
     <div style="display:flex;gap:6px;align-items:center;flex-shrink:0"><button class="btn sm ghost" onclick="event.stopPropagation();openDiaryForm(${e.id})">✏️</button><button class="btn sm ghost" onclick="event.stopPropagation();delDiary(${e.id})">🗑</button><span style="color:var(--muted)">▾</span></div>
    </div>${body}`;
  }else{
   head.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleDiary(${e.id})">
     <div style="min-width:0"><b style="font-size:15px;color:var(--accent-ink)">${mood?esc(mood)+" ":""}${esc(e.date)}</b> · ${meta}<div style="font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px">${esc(diarySummary(e))}</div></div>
     <span style="color:var(--muted);font-size:18px;flex-shrink:0">▸</span>
    </div>`;
  }
  main.appendChild(head);
 });
}

  ${fields}
  <div style="display:flex;gap:6px;margin-top:10px">
   <button class="btn sm primary" onclick="saveDiary(${e?e.id:'null'})">保存</button>

function saveDiary(id){
 const date=normDate(document.getElementById("dyDate").value||todayStr());
 const weather=document.getElementById("dyWeather").value.trim();
 const mood=document.getElementById("dyMood").value.trim();

 else{S.diary.push({id:Date.now(),date:date,weather:weather,mood:mood,sections:sections,createdAt:Date.now(),updatedAt:Date.now()});}

function delDiary(id){if(typeof confirm==="function"&&!confirm("删除这条日记？不可恢复。"))return;S.diary=S.diary.filter(x=>x.id!==id);save();render();toast("已删除");}

// 语音 / 文字记账（增强：支持中文金额、文字指令兜底，所有浏览器可用）
function cnToNum(s){const d={零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};const u={十:10,百:100,千:1000};let total=0,section=0,num=0;for(const ch of s){if(ch in d){num=d[ch];}else if(ch in u){const unit=u[ch];if(num===0)num=1;section+=num*unit;num=0;}else if(ch==="万"){section+=num;total+=section*10000;section=0;num=0;}else if(ch==="亿"){section+=num;total+=section*100000000;section=0;num=0;}}total+=section+num;return total;}
function parseAmountCN(t){let m=t.match(/([0-9]+(?:\.[0-9]+)?)/);if(m)return parseFloat(m[1]);const seg=t.match(/([零一二两三四五六七八九]+[十百千]?|[十百千][零一二两三四五六七八九]?)/);if(seg){const v=cnToNum(seg[1]);if(v>0)return v;}return 0;}
function parseVoiceText(t){
 t=(t||"").trim();
 let amount=parseAmountCN(t);
 let type="out";
 if(/(收入|工资|薪水|赚|进账|发薪|稿费|外快|利息|分红|收益|理财|个税|收到|回款|收了|给的钱|到账)/.test(t))type="in";
 let cat="其他";

 if(cat==="其他"){

   else if(/(还|还款|信用卡|花呗|白条|月供)/.test(t))cat="还款";
 }
 let merchant="";

 if(mm)merchant=mm[1].replace(/(今天|昨天|刚才|早上|中午|晚上|下午|我|去|在)/g,"").trim();
 if(!merchant){const mm2=t.match(/(.+?)(?:花了|付了|消费|买了|支出)/);if(mm2)merchant=mm2[1].replace(/(今天|昨天|刚才|早上|中午|晚上|下午|我)/g,"").trim();}

function vcMic(){

  const btn=document.getElementById("vcMic");if(btn){btn.textContent="⏹ 停止";btn.classList.add("rec");}
  rec.onresult=e=>{const txt=e.results[0][0].transcript;const ta=document.getElementById("vcText");if(ta)ta.value=txt;if(st)st.textContent="识别到：「"+txt+"」点「识别并填入」";const b=document.getElementById("vcMic");if(b){b.textContent="🎙 重新说";b.classList.remove("rec");}};
  rec.onend=()=>{voiceRec=null;const b=document.getElementById("vcMic");if(b){b.textContent="🎙 重新说";b.classList.remove("rec");}};
  rec.onerror=()=>{voiceRec=null;if(st)st.textContent="语音识别失败，可直接输入文字指令";const b=document.getElementById("vcMic");if(b){b.textContent="🎙 开始说话";b.classList.remove("rec");}};

function layoutCarousel(root){if(!root)return;const items=root.querySelectorAll(".cd-disc-item");const N=items.length;if(!N)return;
 items.forEach((el,idx)=>{let off=idx-CD_IDX;off=((off%N)+N)%N;if(off>N/2)off-=N;const a=Math.abs(off);
  const tx=off*96,ry=-off*26,tz=-a*90,sc=1-a*0.13;
  el.style.transform=`translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${sc})`;
  el.style.opacity=off===0?1:(a===1?0.92:(a===2?0.6:0));
  el.style.zIndex=100-a*10;el.style.filter=off===0?"none":"brightness(.9)";
  el.classList.toggle("is-center",off===0);
  if(a>3){el.style.opacity=0;el.style.pointerEvents="none";}else{el.style.pointerEvents="auto";}});}

可用指令与字段（payload 字段均可选，除非标注必填）：
1) add_book：记录一本书。payload：{ "title":必填书名, "author":作者, "tags":标签, "status":"待读"|"在读"|"已读" }

你回复：
好的，已记下今天在麦当劳的午餐开支。
\`\`\`json
{ "action":"add_ledger", "payload":{ "type":"out", "amount":38, "cat":"餐饮", "account":"微信", "merchant":"麦当劳", "note":"午饭" } }
\`\`\``;

function gradeKnowledge(i,g){const k=S.knowledge[i];if(!k)return;
 const today=todayStr();let iv=k.interval||0,reps=k.reps||0,ease=k.ease||2.5;
 if(g==="again"){iv=1;reps=0;ease=Math.max(1.3,ease-0.2);}
 else if(g==="hard"){iv=reps===0?1:Math.max(1,Math.round(iv*1.2));reps=Math.max(1,reps);ease=Math.max(1.3,ease-0.15);}
 else if(g==="good"){iv=reps===0?1:Math.round(iv*2.5);reps+=1;ease=Math.min(3.0,ease+0.05);}
 else if(g==="easy"){iv=reps===0?4:Math.round(iv*3.5);reps+=1;ease=Math.min(3.2,ease+0.15);}
 k.interval=iv;k.reps=reps;k.ease=Math.round(ease*100)/100;k.last=today;k.due=addDaysStr(today,iv);
 pvzAward(4,"复习知识");save();closeDModal();render();toast("已记录 · 下次复习 "+k.due);}
function addDaysStr(dateStr,n){const d=new Date(dateStr);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

function pvzPlantSprite(t){
  const src=PVZ_IMG[t];
  if(src) return `<img class="pvz-img" src="${src}" alt="${t}">`;
  return PVZ_SVG[t]||'';
}
function pvzZombieSprite(type,hp,maxHp,slow){
  const ratio=Math.max(0,Math.min(1,(maxHp?hp/maxHp:1)));
  const hpPct=Math.round(ratio*100);
  const hpColor=hpPct>50?"#67c23a":(hpPct>25?"#e6a23c":"#f56c6c");
  const bar=`<span class="z-hpbar" style="--hp:${hpPct}%;--hp-color:${hpColor}"><span></span></span>`;
  const src=PVZ_IMG.zombie;
  const body=(type==="zombie"&&src)?`<img class="z-img" src="${src}" alt="zombie">`:pvzZombieSVG(type,hp,maxHp,slow);
  return `<span class="z-wrap">${bar}${body}</span>`;
}

 const d=new Date(b.lastDate);d.setMonth(d.getMonth()+(parseInt(b.cycle)||1));const now=new Date();const days=Math.round((d-now)/86400000);
 if(days<0)return{cls:"bad",txt:"逾期 "+(-days)+" 天"};

 return{cls:"ok",txt:"剩 "+days+" 天"};}

let focusState={total:25*60,remaining:25*60,running:false,iv:null};
function todayFocus(){return (S.focus||[]).filter(d=>d===todayStr()).length;}
function focusToggle(){
 if(focusState.running){focusState.running=false;clearInterval(focusState.iv);paintFocus();return;}
 focusState.running=true;
 if(focusState.remaining<=0)focusState.remaining=focusState.total;
 paintFocus();
 focusState.iv=setInterval(()=>{
  focusState.remaining--;
  if(focusState.remaining<=0){
   clearInterval(focusState.iv);focusState.running=false;focusState.remaining=focusState.total;
   S.focus.push(todayStr());S.checkinXp+=5;save();
   toast("🍅 专注完成 +5 XP");confetti();if(navigator.vibrate)navigator.vibrate([40,30,40]);paintFocus();
   const cnt=document.getElementById("fCount");if(cnt)cnt.textContent=todayFocus();
  }else paintFocus();
 },1000);
}
function focusReset(){focusState.running=false;clearInterval(focusState.iv);focusState.remaining=focusState.total;paintFocus();}
function paintFocus(){
 const total=focusState.total,rem=focusState.remaining;
 // 卡片内环（r=60）
 const r1=60,circ1=2*Math.PI*r1;
 const arc=document.getElementById("fArc");
 if(arc){arc.style.strokeDasharray=circ1+" "+circ1;arc.style.strokeDashoffset=circ1*(1-Math.max(0,rem)/total);}
 const t=document.getElementById("fTime");
 if(t){const m=Math.floor(rem/60),s=rem%60;t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
 const btn=document.getElementById("fToggle");
 if(btn)btn.textContent=focusState.running?"⏸ 暂停":"▶ 开始";
 // 沉浸大环（r=104）
 const r2=104,circ2=2*Math.PI*r2;
 const arc2=document.getElementById("fArc2");
 if(arc2){arc2.style.strokeDasharray=circ2+" "+circ2;arc2.style.strokeDashoffset=circ2*(1-Math.max(0,rem)/total);}
 const t2=document.getElementById("fTime2");
 if(t2){const m=Math.floor(rem/60),s=rem%60;t2.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
 const btn2=document.getElementById("fToggle2");
 if(btn2)btn2.textContent=focusState.running?"⏸ 暂停":"▶ 开始";
}
function openFocusOverlay(){const o=document.getElementById("focusOverlay");if(o)o.classList.add("show");paintFocus();if(navigator.vibrate)navigator.vibrate(30);}
function closeFocusOverlay(){const o=document.getElementById("focusOverlay");if(o)o.classList.remove("show");}

function heatmapHtml(datesArr,weeks){
 const set=new Set(datesArr||[]);
 const today=new Date();const days=weeks*7;
 const start=new Date(today);start.setDate(today.getDate()-(days-1));
 let cells="";
 for(let i=0;i<days;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  const on=set.has(key);
  const future=d>today;
  cells+=`<div class="heat-cell${on?' on':''}" style="${future?'opacity:.35':''}" title="${key}${on?' ✅':''}"></div>`;
 }
 return `<div class="heat">${cells}</div>`;
}

var pvzDrag=null,pvzRAF=null;
function pvzStartOfDay(now){const d=new Date(now);d.setHours(0,0,0,0);return d.getTime();}
function pvzPickShop(){return PVZ_PLANTS.slice().sort(function(a,b){return a.cost-b.cost;}).map(function(p){return{t:p.t};});}
function pvzRollDay(){
 const t=todayStr();
 if(S.pvz.day===t)return;
 if(S.pvz.day && S.pvz.day!==t){
  const prevDef=(S.pvz.plants||[]).reduce(function(a,p){return a+(p.def||0);},0);
  if(prevDef<=0){S.pvz.pendingBrain=true;S.pvz.brainShown=false;} // 昨天没布置任何植物 → 脑子被吃
 }
 const z=PVZ_ZOMBIES.find(function(x){return x.t===S.pvz.zombie;})||PVZ_ZOMBIES[0];
 S.pvz.day=t;S.pvz.sun=0;S.pvz.plants=[];S.pvz.shop=pvzPickShop();S.pvz.zombieHp=z.hp;S.pvz.zombieSlowUntil=0;S.pvz.checkedIn=null;
 save();
}
function pvzSim(now){
 pvzRollDay();
 const ds=pvzStartOfDay(now);
 const elapsed=Math.max(0,Math.min(1440*3,(now-ds)/60000));
 const baseStep=100/1440;
 const zType=PVZ_ZOMBIES.find(function(x){return x.t===S.pvz.zombie;})||PVZ_ZOMBIES[0];
 const maxHp=zType.hp;
 // 重新从当天起点模拟，保证状态一致
 let curHp=maxHp;
 let slowUntil=0;
 const plants=(S.pvz.plants||[]).filter(function(p){return p.alive!==false;}).map(function(p){return {pos:p.pos,def:p.def,eaten:0,id:p.id,t:p.t,placedAt:p.placedAt};});
 plants.sort(function(a,b){return a.pos-b.pos;});
 const EAT_BAND=2; // 僵尸只啃"脚下/刚到达"的植物，已越过的不再回头啃，避免放植物时位置被拽动
 let realT=0,pos=0;
 while(realT<elapsed && pos<100){
  const hpFactor=Math.max(0.35,curHp/maxHp);
  let slowFactor=1;
  if(slowUntil>realT*60000+ds)slowFactor=0.6;
  const speed=baseStep*zType.speed*hpFactor*slowFactor;
  const simMs=ds+realT*60000;
  // 植物攻击（位于僵尸右侧的射手；近身植物需僵尸逼近才咬）。未种下的植物不参与，避免"放植物瞬间"回算改变现状。
  for(const p of plants){
   if(p.placedAt!==undefined && simMs<p.placedAt)continue;
   if(p.pos>=pos-3){
    const def=PVZ_PLANTS.find(function(x){return x.t===p.t;});
    if(!def)continue;
    if(def.dmg>0 && realT%3===0){
     const reach=def.melee?3:999;
     if(p.pos>=pos-reach){
      curHp-=def.dmg;
      if(def.slow){ if(!def.butter || realT%9===0) slowUntil=realT*60000+ds+600000; }
     }
    }
    if(def.burn && p.pos-pos<8 && realT%2===0)curHp-=4;
    if(def.explode && Math.abs(p.pos-pos)<=2.5 && p.eaten<def.def){curHp-=def.explode;p.alive=false;}
   }
  }
  curHp=Math.max(0,curHp);
  // 僵尸只啃"脚下/刚到达"的植物，已越过的不再回头啃；未种下的不参与
  let cur=null;
  for(const p of plants){
   if(p.alive===false)continue;
   if(p.eaten>=p.def)continue;
   if(p.placedAt!==undefined && simMs<p.placedAt)continue;
   if(p.pos<=pos+0.0001 && p.pos>pos-EAT_BAND){ if(!cur||p.pos>cur.pos)cur=p; }
  }
  if(cur){ cur.eaten+=1; } else { pos+=speed; }
  realT+=1;
 }
 S.pvz.zombieHp=curHp;
 const posPct=Math.min(100,pos);
 const arrived=pos>=100;
 const totalDef=plants.reduce(function(a,p){return a+p.def;},0);
 const arrivalMin=Math.round((100-pos)/(baseStep*zType.speed)+elapsed+totalDef);
 const remainToMid=Math.max(0,1440-elapsed);
 const slowNow=slowUntil>(elapsed*60000+ds);
 return {posPct:posPct,arrived:arrived,plants:plants,pos:pos,totalDef:totalDef,arrivalMin:arrivalMin,remainToMid:remainToMid,elapsed:elapsed,hp:curHp,maxHp:maxHp,zType:zType,slow:slowNow};
}
function pvzAward(amount,reason){
 pvzRollDay();
 if(!S.pvz)S.pvz={day:null,sun:0,plants:[],shop:[],pendingBrain:false,brainShown:false};
 S.pvz.sun=(S.pvz.sun||0)+amount;
 S.pvz.log=S.pvz.log||[];
 S.pvz.log.push({t:todayStr(),amount:amount,reason:reason});
 if(S.pvz.log.length>200)S.pvz.log=S.pvz.log.slice(-200);
 save();renderPvzBar();
}
function pvzTickSun(){
 pvzRollDay();
 const now=Date.now();
 const interval=10*60000;
 const dayStart=pvzStartOfDay(now);
 let last=S.pvz.lastSunTs||dayStart;
 if(last<dayStart)last=dayStart;
 const due=Math.floor((now-last)/interval);
 if(due<=0){ if(!S.pvz.lastSunTs)S.pvz.lastSunTs=last; return; }
 const plants=(S.pvz.plants||[]).filter(function(p){return p.alive!==false;});
 let gain=0;
 for(const p of plants){const def=PVZ_PLANTS.find(function(x){return x.t===p.t;});if(def&&def.sunYield)gain+=def.sunYield*due;}
 if(gain>0){
  S.pvz.sun=(S.pvz.sun||0)+gain;
  S.pvz.lastSunTs=last+due*interval;
  S.pvz.log=S.pvz.log||[];S.pvz.log.push({t:todayStr(),amount:gain,reason:"阳光植物产出"});if(S.pvz.log.length>200)S.pvz.log=S.pvz.log.slice(-200);
  save();renderPvzBar();
 } else { S.pvz.lastSunTs=last+due*interval; }
}
function pvzBuy(t){
